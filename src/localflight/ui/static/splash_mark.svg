<svg width="1024" height="1024" viewBox="0 0 1024 1024" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Local Flight splash mark</title>
  <desc>High resolution Local Flight airport display mark with aircraft, runway, radar rings, and FIDS rows.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#163047"/>
      <stop offset="0.55" stop-color="#0b1722"/>
      <stop offset="1" stop-color="#050a10"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4f0" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#29e287" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#c9ddf7"/>
      <stop offset="1" stop-color="#8fb7da"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="512" cy="512" r="478" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="446" fill="none" stroke="#7cc4f0" stroke-opacity="0.28" stroke-width="4"/>
  <circle cx="512" cy="512" r="384" fill="none" stroke="#1f4d70" stroke-opacity="0.70" stroke-width="2"/>
  <circle cx="512" cy="512" r="306" fill="none" stroke="#29e287" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="512" cy="512" r="214" fill="none" stroke="#f0b429" stroke-opacity="0.13" stroke-width="2"/>

  <g opacity="0.42">
    <path d="M512 74v876" stroke="#7cc4f0" stroke-width="2" stroke-dasharray="13 22"/>
    <path d="M74 512h876" stroke="#7cc4f0" stroke-width="2" stroke-dasharray="13 22"/>
    <path d="M202 202l620 620" stroke="#1f4d70" stroke-width="2" stroke-dasharray="12 24"/>
    <path d="M822 202L202 822" stroke="#1f4d70" stroke-width="2" stroke-dasharray="12 24"/>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="214" y="596" width="596" height="188" rx="34" fill="#09131d" stroke="url(#glass)" stroke-width="3"/>
    <rect x="244" y="626" width="536" height="38" rx="12" fill="#101f2e"/>
    <rect x="244" y="682" width="536" height="38" rx="12" fill="#0d1a27"/>
    <rect x="244" y="738" width="536" height="20" rx="10" fill="#101f2e" opacity="0.92"/>

    <circle cx="278" cy="645" r="9" fill="#29e287"/>
    <rect x="306" y="638" width="108" height="10" rx="5" fill="#7cc4f0" opacity="0.62"/>
    <rect x="444" y="638" width="154" height="10" rx="5" fill="#7cc4f0" opacity="0.34"/>
    <rect x="660" y="638" width="78" height="10" rx="5" fill="#f0b429" opacity="0.62"/>

    <circle cx="278" cy="701" r="9" fill="#7cc4f0"/>
    <rect x="306" y="694" width="96" height="10" rx="5" fill="#7cc4f0" opacity="0.50"/>
    <rect x="444" y="694" width="180" height="10" rx="5" fill="#7cc4f0" opacity="0.30"/>
    <rect x="660" y="694" width="96" height="10" rx="5" fill="#29e287" opacity="0.55"/>

    <circle cx="278" cy="748" r="7" fill="#f0b429"/>
    <rect x="306" y="742" width="128" height="8" rx="4" fill="#7cc4f0" opacity="0.36"/>
    <rect x="444" y="742" width="205" height="8" rx="4" fill="#7cc4f0" opacity="0.22"/>
