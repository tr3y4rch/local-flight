  <g transform="translate(512 415) rotate(-17)" filter="url(#soft-shadow)">
    <path d="M-16 70C-7 18 -4 -58 0 -196C4 -58 7 18 16 70C7 62 2 60 0 60C-2 60 -7 62 -16 70Z" fill="url(#plane)"/>
    <path d="M-152 20C-96 4 -42 -2 0 4C42 -2 96 4 152 20C89 38 38 34 0 28C-38 34 -89 38 -152 20Z" fill="#c3d9f3"/>
    <path d="M-72 64C-40 46 -15 42 0 44C15 42 40 46 72 64C39 74 14 70 0 66C-14 70 -39 74 -72 64Z" fill="#a9c8e8"/>
    <path d="M0 -196L-9 -158H9Z" fill="#f8fbff"/>
  </g>

  <g opacity="0.9">
    <circle cx="512" cy="90" r="7" fill="#7cc4f0"/>
    <circle cx="512" cy="934" r="7" fill="#7cc4f0"/>
    <circle cx="90" cy="512" r="7" fill="#29e287"/>
    <circle cx="934" cy="512" r="7" fill="#f0b429"/>
