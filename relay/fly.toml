# fly.toml app configuration file generated for localflight-community-relay on 2026-04-28T04:48:43+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'localflight-community-relay'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/relay.db'
  PORT = '8080'
  RELAY_COMMUNITY_SCHEDULE_LIMIT = '50'
  RELAY_AIRPORT_GROUND_ENABLED = '1'
  RELAY_GROUND_PREWARM_ENABLED = '1'
  RELAY_OVERPASS_URL = 'https://overpass-api.de/api/interpreter'
  RELAY_PUBLIC_HOST = 'relay.beacontools.cc'
  RELAY_ADMIN_HOST = 'network.beacontools.cc'
  # 'migration': the founder snapshot ran at the cutoff below and preserved 38
  # legacy installs as permanent founders, so /v1/activate no longer issues new
  # anonymous credentials. Founder lfm_ credentials keep working through the
  # 12-month bridge and exchange themselves for lfr_ on first contact with a
  # 0.7.0 client. Shared real radar closes here, as the annual entitlement
  # deliberately excludes it.
  RELAY_ACCESS_MODE = 'migration'
  RELAY_ACCESS_DEPLOYMENT_ENVIRONMENT = 'production'
  RELAY_ACCESS_PRODUCT_CODE = 'beacon_relay_annual_v1'
  # Immutable once the founder snapshot runs. Eligibility is successful
  # authenticated activity in the 90 days before this instant, which
  # grandfathers 38 of the 64 legacy installs present at launch.
  RELAY_ACCESS_FOUNDER_CUTOFF_AT = '2026-09-10T00:00:00+00:00'
  RELAY_ACCESS_HASH_SECRET_ID = 'v1'
  RELAY_ACCESS_KEY_SECRET_ID = 'v1'
  RELAY_ACCESS_ENCRYPTION_SECRET_ID = 'v1'
  RELAY_ACCESS_SALES_ENABLED = '1'
  RELAY_ACCESS_STRIPE_SALES_ENABLED = '1'
  RELAY_ACCESS_APPLE_SALES_ENABLED = '0'
  RELAY_ACCESS_GOOGLE_SALES_ENABLED = '0'
  RELAY_ACCESS_OPERATOR_ISSUANCE_ENABLED = '0'
  RELAY_ACCESS_MOBILE_OWNERSHIP_ENABLED = '0'
  RELAY_ACCESS_SCHEDULE_ENABLED = '1'
  RELAY_ACCESS_RADAR_ENABLED = '0'
  RELAY_ACCESS_REMOTE_COMPANION_ENABLED = '1'
  RELAY_ACCESS_ALLOW_TEST_LICENSES = '0'
  RELAY_ACCESS_SITE_URL = 'https://beacontools.cc'
  RELAY_ACCESS_IOS_STATE = 'unavailable'
  RELAY_ACCESS_ANDROID_STATE = 'unavailable'
  GOOGLE_PLAY_PURCHASE_ENVIRONMENT = 'production'
  APPLE_RELAY_ACCESS_SUBSCRIPTION_ID = 'cc.beacontools.localflight.relay_access.annual'
  GOOGLE_RELAY_ACCESS_SUBSCRIPTION_ID = 'cc.beacontools.localflight.relay_access.annual'
  RELAY_ACCESS_BACKUP_ENABLED = '1'
  RELAY_ACCESS_BACKUP_DIRECTORY = '/data/relay-access-backups'
  RELAY_ACCESS_BACKUP_KEY_ID = 'v1'

[[mounts]]
  source = 'relay_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  protocol = 'http'
  timeout = '5s'

  [http_service.checks.headers]
    X-Forwarded-Proto = 'https'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
