# fly.toml app configuration file generated for localflight-relay on 2026-04-28T04:09:27+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'localflight-relay'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/relay.db'
  PORT = '8080'
  RELAY_MONTHLY_LIMIT = '50'

[[mounts]]
  source = 'relay_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  