# Local Flight Community Relay — Fly.io config
# Deploy: fly deploy (from the relay/ directory)
# Secrets: fly secrets set AVIATIONSTACK_API_KEY=... RELAY_ADMIN_PASSWORD=...
#
# App name must be globally unique on Fly.io — change if taken.
app            = "localflight-relay"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT                = "8080"
  DB_PATH             = "/data/relay.db"
  RELAY_MONTHLY_LIMIT = "50"

# Persistent volume for SQLite.
# Create once: fly volumes create relay_data --region fra --size 1
[[mounts]]
  source      = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024


