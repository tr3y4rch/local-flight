<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lfid-title lfid-desc">
  <title id="lfid-title">Local Flight — app icon dark</title>
  <desc id="lfid-desc">Radar sweep, runway tower, and aircraft mark on deep navy.</desc>
  <defs>

    <!-- ── GRADIENTS ──────────────────────────────────────────── -->

    <!-- Deep space background -->
    <linearGradient id="lf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#1B2B37"/>
      <stop offset="0.48" stop-color="#0A1420"/>
      <stop offset="1"    stop-color="#020609"/>
    </linearGradient>

    <!-- Ambient sweep bloom on the raw background -->
    <radialGradient id="lf-bgGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(400 310) rotate(30) scale(370 290)">
      <stop offset="0"    stop-color="#28EDF8" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#18C4D6" stop-opacity="0.11"/>
      <stop offset="1"    stop-color="#0FB0C4" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge vignette (gives the icon a spherical depth feeling) -->
    <radialGradient id="lf-vig" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0"    stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.56"/>
    </radialGradient>

    <!-- Card glass sheen (top-left specular highlight) -->
    <linearGradient id="lf-sheen" x1="152" y1="152" x2="640" y2="580"
      gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.018"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Card rim light (top-left bright → bottom-right dim) -->
    <linearGradient id="lf-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#FFFFFF"  stop-opacity="0.26"/>
      <stop offset="0.35" stop-color="#39EDF7"  stop-opacity="0.13"/>
      <stop offset="0.70" stop-color="#FFFFFF"  stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#FFFFFF"  stop-opacity="0.02"/>
    </linearGradient>

    <!-- Inner card ambient (echo of background glow inside card) -->
    <radialGradient id="lf-cardGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(380 290) rotate(30) scale(340 270)">
      <stop offset="0"    stop-color="#2BEDF9" stop-opacity="0.30"/>
      <stop offset="0.50" stop-color="#18C8DA" stop-opacity="0.07"/>
      <stop offset="1"    stop-color="#0FB4C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar sweep sector: vivid cyan arc → fully transparent at pivot -->
    <linearGradient id="lf-sweep" x1="338" y1="212" x2="508" y2="474"
      gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#52F6FF" stop-opacity="0.92"/>
      <stop offset="0.36" stop-color="#1ED2E6" stop-opacity="0.60"/>
      <stop offset="0.70" stop-color="#0D90A4" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#0A8EA2" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Blip radial: off-white hot core → vivid cyan -->
    <radialGradient id="lf-blip" cx="0.38" cy="0.38" r="0.62">
      <stop offset="0"    stop-color="#E8FFFF" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#48F2FF" stop-opacity="0.96"/>
      <stop offset="1"    stop-color="#1AD0E4" stop-opacity="0.86"/>
    </radialGradient>

    <!-- ── FILTERS ─────────────────────────────────────────────── -->

    <!-- Card drop shadow: deep, slightly warm black -->
    <filter id="lf-cardShadow" x="-10%" y="-10%" width="120%" height="120%"
      color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="30"
        flood-color="#000000" flood-opacity="0.80"/>
    </filter>

    <!-- Sweep bloom: blurred copy under crisp fill = neon glow -->
    <filter id="lf-sweepBloom" x="-40%" y="-40%" width="180%" height="180%"
      color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blurA"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blurB"/>
      <feMerge>
        <feMergeNode in="blurA"/>
        <feMergeNode in="blurB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Leading-edge arc glow (applied to the cyan arc stroke) -->
    <filter id="lf-edgeGlow" x="-100%" y="-100%" width="300%" height="300%"
      color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="13" result="blurA"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"  result="blurB"/>
      <feMerge>
        <feMergeNode in="blurA"/>
        <feMergeNode in="blurA"/>
        <feMergeNode in="blurB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blip neon glow (two-radius bloom for that punchy neon feel) -->
    <filter id="lf-blipGlow" x="-140%" y="-140%" width="380%" height="380%"
      color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blurA"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"  result="blurB"/>
      <feMerge>
        <feMergeNode in="blurA"/>
        <feMergeNode in="blurA"/>
        <feMergeNode in="blurB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Aircraft subtle luminance halo -->
    <filter id="lf-planeGlow" x="-18%" y="-18%" width="136%" height="136%"
      color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to card bounds so glow stays inside the rounded rect -->
    <clipPath id="lf-cardClip">
      <rect x="152" y="152" width="720" height="720" rx="150"/>
    </clipPath>

  </defs>

  <!-- ── BACKGROUND ─────────────────────────────────────────── -->
  <rect width="1024" height="1024" fill="url(#lf-bg)"/>
  <rect width="1024" height="1024" fill="url(#lf-bgGlow)"/>
  <rect width="1024" height="1024" fill="url(#lf-vig)"/>

  <!-- ── CARD ───────────────────────────────────────────────── -->
  <g filter="url(#lf-cardShadow)">
    <rect x="152" y="152" width="720" height="720" rx="150" fill="#060E18"/>
  </g>
  <!-- Inner ambient glow on card surface -->
  <rect x="152" y="152" width="720" height="720" rx="150" fill="url(#lf-cardGlow)"/>
  <!-- Glass sheen -->
  <rect x="152" y="152" width="720" height="720" rx="150" fill="url(#lf-sheen)"/>
  <!-- Rim light stroke -->
  <rect x="152" y="152" width="720" height="720" rx="150"
    fill="none" stroke="url(#lf-rim)" stroke-width="1.5"/>
  <!-- Inner hairline border (barely visible, adds precision) -->
  <rect x="177" y="177" width="670" height="670" rx="125"
    fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>

  <!-- ── RADAR CONTENT (clipped to card) ───────────────────── -->
  <g clip-path="url(#lf-cardClip)">

    <!-- SWEEP — bloom layer first (blurred), then crisp fill on top -->
    <path d="M512 224A288 288 0 0 0 312 304L512 512V224Z"
      fill="url(#lf-sweep)" opacity="0.68" filter="url(#lf-sweepBloom)"/>
    <path d="M512 224A288 288 0 0 0 312 304L512 512V224Z"
      fill="url(#lf-sweep)" opacity="0.52"/>

    <!-- LEADING EDGE: glow layer + crisp overlay -->
    <path d="M512 224A288 288 0 0 0 312 304"
      stroke="#6CF8FF" stroke-width="4.5" stroke-linecap="round"
      opacity="0.88" filter="url(#lf-edgeGlow)"/>
    <path d="M512 224A288 288 0 0 0 312 304"
      stroke="#D6FDFF" stroke-width="1.8" stroke-linecap="round" opacity="0.82"/>

    <!-- RADAR RINGS (4 rings, graduated opacity) -->
    <circle cx="512" cy="512" r="288" fill="none"
      stroke="#DCE7EE" stroke-opacity="0.38" stroke-width="8"/>
    <circle cx="512" cy="512" r="224" fill="none"
      stroke="#DCE7EE" stroke-opacity="0.19" stroke-width="4.5"/>
    <circle cx="512" cy="512" r="160" fill="none"
      stroke="#DCE7EE" stroke-opacity="0.24" stroke-width="4"/>
    <circle cx="512" cy="512" r="90"  fill="none"
      stroke="#DCE7EE" stroke-opacity="0.13" stroke-width="2.5"/>

    <!-- CARDINAL TICK MARKS (N/E/S/W) -->
    <path d="M512 224v66  M512 734v66  M224 512h66  M734 512h66"
      stroke="#DCE7EE" stroke-opacity="0.42" stroke-width="9" stroke-linecap="round"/>

    <!-- DIAGONAL ARCS (45° hints) -->
    <path d="M658 286a286 286 0 0 1 74 74
             M366 738a286 286 0 0 1-72-76"
      stroke="#DCE7EE" stroke-opacity="0.26" stroke-width="8" stroke-linecap="round"/>

    <!-- CROSSHAIR LINES (faint, full-card) -->
    <line x1="224" y1="512" x2="800" y2="512"
      stroke="#A8B8C4" stroke-opacity="0.20" stroke-width="5"/>
    <line x1="512" y1="224" x2="512" y2="800"
      stroke="#A8B8C4" stroke-opacity="0.20" stroke-width="5"/>
    <line x1="309" y1="715" x2="715" y2="309"
      stroke="#A8B8C4" stroke-opacity="0.18" stroke-width="4.5"/>

    <!-- TOWER / RUNWAY MARKER -->
    <rect x="468" y="446" width="88" height="286" rx="7"
      fill="#05090F" stroke="#DCE7EE" stroke-opacity="0.38" stroke-width="5"/>
    <line x1="512" y1="476" x2="512" y2="520"
      stroke="#FFFFFF" stroke-width="12" stroke-linecap="square"/>
    <line x1="512" y1="562" x2="512" y2="604"
      stroke="#FFFFFF" stroke-width="12" stroke-linecap="square"/>
    <line x1="512" y1="648" x2="512" y2="690"
      stroke="#FFFFFF" stroke-width="12" stroke-linecap="square"/>
    <line x1="490" y1="592" x2="534" y2="592"
      stroke="#FFFFFF" stroke-width="9" stroke-linecap="square" opacity="0.80"/>

    <!-- AIRCRAFT (rotated -42° around center) -->
    <g transform="translate(512 512) rotate(-42) translate(-512 -512)"
       filter="url(#lf-planeGlow)">
      <path d="M512 287c18 0 31 14 31 33v131l151 84c13 8 21 21 21 36v22
               c0 10-10 17-20 13l-152-55v102l47 35c9 7 14 17 14 28v18
               c0 8-8 14-16 11l-76-26-76 26c-8 3-16-3-16-11v-18
               c0-11 5-21 14-28l47-35V551l-152 55c-10 4-20-3-20-13v-22
               c0-15 8-28 21-36l151-84V320c0-19 13-33 31-33Z"
        fill="#FFFFFF" stroke="#050C15" stroke-opacity="0.18" stroke-width="4"/>
    </g>

    <!-- RADAR BLIP: three ping rings + glowing core + bright dot -->
    <circle cx="650" cy="350" r="64" fill="none"
      stroke="#22D7E8" stroke-opacity="0.08" stroke-width="6"/>
    <circle cx="650" cy="350" r="48" fill="none"
      stroke="#22D7E8" stroke-opacity="0.16" stroke-width="6.5"/>
    <circle cx="650" cy="350" r="32" fill="none"
      stroke="#22D7E8" stroke-opacity="0.28" stroke-width="7"/>
    <!-- Glowing filled circle -->
    <circle cx="650" cy="350" r="20"
      fill="url(#lf-blip)" stroke="#040A12" stroke-width="5"
      filter="url(#lf-blipGlow)"/>
    <!-- Hot inner core dot -->
    <circle cx="650" cy="350" r="8" fill="#EEFFFF" opacity="0.96"/>

  </g><!-- end card clip -->

</svg>
