<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight native history preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight native Qt History dashboard with filters, movement counts, delay buckets, status mix, route stats, and aircraft stats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a10"/>
      <stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .text { fill: #edf5ff; }
      .soft { fill: #89d4ff; }
      .muted { fill: #6f88a2; }
      .blue { fill: #4fa3dc; }
      .tiny { font-size: 8px; letter-spacing: 1.1px; }
      .label { font-size: 10px; font-weight: 800; letter-spacing: 1px; }
      .kicker { fill: #4f93c8; font-size: 8px; letter-spacing: 1.8px; font-weight: 900; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#202020"/>
  <rect y="12" width="960" height="528" fill="url(#bg)"/>
  <rect y="12" width="960" height="30" fill="#090e14" stroke="#1a2531"/>
  <text x="23" y="32" class="sans text" font-size="13" font-weight="900">Local Flight</text>
  <text x="82" y="32" class="mono soft" font-size="7">v0.2.7</text>
  <g transform="translate(108 18)" class="mono label">
    <text x="13" y="15" class="soft">Display</text><text x="63" y="15" class="soft">FIDS</text><text x="106" y="15" class="soft">Radar</text>
  </g>
  <g transform="translate(366 18)">
    <rect x="0" y="0" width="62" height="22" rx="7" fill="#0d2034" stroke="#2d5f8c"/><text x="9" y="15" class="mono soft" font-size="10">UTC 16:02</text>
    <rect x="68" y="0" width="58" height="22" rx="7" fill="#0d2034" stroke="#2d5f8c"/><text x="78" y="15" class="mono soft" font-size="10">LT 18:02</text>
  </g>
  <g transform="translate(628 18)" class="mono label">
    <text x="0" y="15" fill="#5ee5a0">Matrix</text><text x="58" y="15" class="soft">Settings</text><text x="112" y="15" class="soft">Admin</text>
    <rect x="154" y="0" width="54" height="22" rx="5" fill="#10263b" stroke="#45a5ea"/><text x="164" y="15" class="text">History</text>
    <text x="216" y="15" class="soft">Logs</text><text x="262" y="15" class="soft">Report</text>
  </g>

  <g transform="translate(9 54)">
    <rect width="942" height="42" rx="8" fill="#111820" stroke="#1f2a36"/>
    <text x="18" y="23" class="sans text" font-size="15" font-weight="900">Flight History</text>
    <text x="18" y="36" class="sans soft" font-size="9">Airport-board analytics: delay quotas, airline performance, routes, aircraft, and recent movements.</text>
    <rect x="856" y="8" width="74" height="26" fill="#151b22" stroke="#2d3641"/>
    <text x="873" y="25" class="mono soft" font-size="8" font-weight="900">Updated 18:02:40</text>
  </g>

  <g transform="translate(9 104)">
    <rect width="942" height="58" rx="8" fill="#0f1823" stroke="#23466a"/>
    <text x="8" y="15" class="mono kicker">FILTERS</text>
    <text x="8" y="32" class="sans soft" font-size="8">Callsign</text><rect x="8" y="42" width="90" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="10" y="51" class="mono muted" font-size="8">Callsign, e.g. LX1952</text>
    <text x="104" y="32" class="sans soft" font-size="8">Airline</text><rect x="104" y="42" width="50" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="106" y="51" class="mono muted" font-size="8">Airline</text>
    <text x="160" y="32" class="sans soft" font-size="8">Period</text><rect x="160" y="42" width="150" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="163" y="51" class="mono text" font-size="8">Last 6h</text>
    <text x="316" y="32" class="sans soft" font-size="8">Direction</text><rect x="316" y="42" width="150" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="319" y="51" class="mono text" font-size="8">Both</text>
    <text x="472" y="32" class="sans soft" font-size="8">Status</text><rect x="472" y="42" width="150" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="475" y="51" class="mono text" font-size="8">All statuses</text>
    <rect x="628" y="38" width="150" height="18" rx="5" fill="#14344f" stroke="#3b78a9"/><text x="692" y="51" class="mono text" font-size="8" font-weight="900">Apply</text>
    <rect x="784" y="38" width="150" height="18" rx="5" fill="#111820" stroke="#1f2a36"/><text x="852" y="51" class="mono soft" font-size="8" font-weight="900">Clear</text>
  </g>
  <text x="9" y="176" class="sans" fill="#00e676" font-size="9">500 movements from raw observations loaded.</text>

