      <text x="328" y="60" class="sans soft" font-size="8">05-16</text><rect x="396" y="48" width="230" height="14" rx="5" fill="#141a20"/><rect x="396" y="48" width="224" height="14" rx="5" fill="#4fa3dc"/><text x="616" y="59" class="sans soft" font-size="8">719</text>
      <text x="328" y="86" class="sans soft" font-size="8">05-17</text><rect x="396" y="74" width="230" height="14" rx="5" fill="#141a20"/><rect x="396" y="74" width="72" height="14" rx="5" fill="#4fa3dc"/><text x="616" y="85" class="sans soft" font-size="8">236</text>
