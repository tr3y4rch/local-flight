      <text x="648" y="58" class="sans soft" font-size="8">Unknown 24.9%</text><rect x="718" y="49" width="210" height="12" rx="5" fill="#141a20"/><rect x="718" y="49" width="76" height="12" rx="5" fill="#4fa3dc"/><text x="930" y="58" class="sans soft" font-size="8">238</text>
      <text x="648" y="78" class="sans soft" font-size="8">Departed 2.6%</text><rect x="718" y="69" width="210" height="12" rx="5" fill="#141a20"/><rect x="718" y="69" width="8" height="12" rx="4" fill="#4fa3dc"/><text x="930" y="78" class="sans soft" font-size="8">25</text>
      <text x="648" y="98" class="sans soft" font-size="8">Arrived 2.4%</text><rect x="718" y="89" width="210" height="12" rx="5" fill="#141a20"/><rect x="718" y="89" width="7" height="12" rx="4" fill="#4fa3dc"/><text x="930" y="98" class="sans soft" font-size="8">23</text>
    </g>
  </g>

