    <g class="sans soft" font-size="8">
      <text x="328" y="36">LAX-&gt;SFO 0% late</text><rect x="400" y="27" width="220" height="12" rx="5" fill="#141a20"/><rect x="400" y="27" width="216" height="12" rx="5" fill="#4fa3dc"/><text x="624" y="36">27</text>
      <text x="328" y="56">SFO-&gt;LAX 3.7% late</text><rect x="400" y="47" width="220" height="12" rx="5" fill="#141a20"/><rect x="400" y="47" width="216" height="12" rx="5" fill="#4fa3dc"/><text x="624" y="56">27</text>
      <text x="328" y="76">JFK-&gt;LAX 5.6% late</text><rect x="400" y="67" width="220" height="12" rx="5" fill="#141a20"/><rect x="400" y="67" width="146" height="12" rx="5" fill="#4fa3dc"/><text x="624" y="76">18</text>
      <text x="328" y="96">LAX-&gt;DEN 5.9% late</text><rect x="400" y="87" width="220" height="12" rx="5" fill="#141a20"/><rect x="400" y="87" width="138" height="12" rx="5" fill="#4fa3dc"/><text x="624" y="96">17</text>
