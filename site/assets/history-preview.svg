      <text x="8" y="14" class="mono kicker">FLIGHTS TRACKED</text><text x="8" y="34" class="sans text" font-size="18" font-weight="900">955</text><text x="64" y="34" class="sans soft" font-size="9">local DB</text>
      <rect x="320" y="0" width="304" height="46" rx="8" fill="#0f1823" stroke="#23466a"/>
      <text x="328" y="14" class="mono kicker">DEPARTURES</text><text x="328" y="34" class="sans text" font-size="18" font-weight="900">478</text><text x="384" y="34" class="sans soft" font-size="9">outbound rows</text>
      <rect x="640" y="0" width="302" height="46" rx="8" fill="#0f1823" stroke="#23466a"/>
