      <text x="648" y="76">A321</text><rect x="718" y="67" width="210" height="12" rx="5" fill="#141a20"/><rect x="718" y="67" width="136" height="12" rx="5" fill="#4fa3dc"/><text x="930" y="76">67</text>
      <text x="648" y="96">B789</text><rect x="718" y="87" width="210" height="12" rx="5" fill="#141a20"/><rect x="718" y="87" width="64" height="12" rx="5" fill="#4fa3dc"/><text x="930" y="96">31</text>
