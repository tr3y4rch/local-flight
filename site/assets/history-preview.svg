      <text x="8" y="76">AA 3.5% late</text><rect x="76" y="67" width="220" height="12" rx="5" fill="#141a20"/><rect x="76" y="67" width="188" height="12" rx="5" fill="#4fa3dc"/><text x="300" y="76">171</text>
      <text x="8" y="96">AS 0% late</text><rect x="76" y="87" width="220" height="12" rx="5" fill="#141a20"/><rect x="76" y="87" width="112" height="12" rx="5" fill="#4fa3dc"/><text x="300" y="96">103</text>
