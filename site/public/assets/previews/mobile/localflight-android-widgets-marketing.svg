<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight Home Screen widgets for Android</title>
  <desc id="desc">Marketing artwork showing the current Local Flight resizable Android widget in compact pinned-flight and expanded airport-board layouts, using the native RemoteViews hierarchy and sample data.</desc>

  <defs>
    <style>
      @font-face { font-family: "LFDM"; src: url("/assets/fonts/DMSans.ttf") format("truetype"); }
      @font-face { font-family: "LFMono"; src: url("/assets/fonts/SpaceMono-Regular.ttf") format("truetype"); }
      @font-face { font-family: "LFMono"; src: url("/assets/fonts/SpaceMono-Bold.ttf") format("truetype"); font-weight: 700; }
      .ui { font-family: "LFDM", "DM Sans", Roboto, sans-serif; }
      .mono { font-family: "LFMono", "Space Mono", ui-monospace, monospace; }
      .caps { letter-spacing: .12em; text-transform: uppercase; }
    </style>

