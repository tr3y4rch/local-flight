    <clipPath id="board-screen"><rect x="1068" y="264" width="364" height="776" rx="48"/></clipPath>
    <clipPath id="compact-widget"><rect x="650" y="360" width="320" height="290" rx="24"/></clipPath>
    <clipPath id="board-widget"><rect x="1090" y="360" width="320" height="320" rx="24"/></clipPath>
