  <rect width="1600" height="1200" fill="#07131B"/>
  <path d="M0 1054H1600" stroke="#1D3541"/>
  <rect x="552" y="198" width="960" height="882" rx="58" fill="url(#scene)" stroke="#1E3845"/>
  <path d="M598 238H1466" stroke="#284450" stroke-dasharray="2 11"/>

  <!-- Marketing copy -->
  <use href="#lf-wordmark" transform="translate(86 89) scale(.026 -.026)" fill="#F5F0E8"/>
  <text x="88" y="151" class="mono caps" font-size="13" font-weight="700" fill="#74B5DE">Android Home Screen widgets</text>
  <text x="88" y="224" class="ui" font-size="52" font-weight="700" fill="#F5F0E8">Your airport board.</text>
  <text x="88" y="284" class="ui" font-size="52" font-weight="700" fill="#F5F0E8">One glance away.</text>
  <text x="88" y="352" class="ui" font-size="20" fill="#A4B3BE">
    <tspan x="88">Resize from one pinned flight to a full</tspan>
    <tspan x="88" dy="29">three-row board—right on your Home Screen.</tspan>
  </text>

  <g transform="translate(88 462)">
    <path d="M0 0H392" stroke="#284552"/>
    <text x="0" y="34" class="mono caps" font-size="11" font-weight="700" fill="#E4B454">Compact</text>
    <text x="0" y="67" class="ui" font-size="20" font-weight="700" fill="#F5F0E8">Keep one pinned flight close</text>
    <text x="0" y="95" class="ui" font-size="15" fill="#A4B3BE">Flight, route, time, status, and gate.</text>
    <path d="M0 135H392" stroke="#284552"/>
    <text x="0" y="169" class="mono caps" font-size="11" font-weight="700" fill="#59C1A5">Expanded</text>
    <text x="0" y="202" class="ui" font-size="20" font-weight="700" fill="#F5F0E8">See up to three airport movements</text>
    <text x="0" y="230" class="ui" font-size="15" fill="#A4B3BE">The row count follows the widget’s height.</text>
    <path d="M0 270H392" stroke="#284552"/>
    <text x="0" y="304" class="mono caps" font-size="11" font-weight="700" fill="#74B5DE">System-aware</text>
    <text x="0" y="337" class="ui" font-size="20" font-weight="700" fill="#F5F0E8">Light, dark, and Android accent</text>
    <text x="0" y="365" class="ui" font-size="15" fill="#A4B3BE">The widget reads a saved copy from the app.</text>
  </g>

