    <rect x="120" y="340" width="40" height="4" rx="2" fill="#1a3050"/>
    <rect x="200" y="332" width="70" height="4" rx="2" fill="#1e3a5f"/>
    <rect x="200" y="340" width="50" height="4" rx="2" fill="#1a3050"/>
    <rect x="290" y="332" width="55" height="4" rx="2" fill="#1e3a5f"/>
    <rect x="290" y="340" width="35" height="4" rx="2" fill="#1a3050"/>
    <rect x="370" y="332" width="65" height="4" rx="2" fill="#1e3a5f"/>
