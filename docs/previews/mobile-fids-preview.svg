<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight mobile FIDS preview</title>
  <desc id="desc">Local Flight mobile 0.5.1 — Board screen with airport hero, status strip, pinned flight, two-line FIDS rows, and delay tags.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1620"/>
      <stop offset="1" stop-color="#080d14"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10202e"/>
      <stop offset="1" stop-color="#0a121b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e8f0f8; }
      .muted { fill: #7f90a5; }
      .blue { fill: #62b7f6; }
      .dim { fill: #48647f; }
      .amber { fill: #f4b740; }
      .tiny { font-size: 9px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <g transform="translate(322 18) scale(1.1)" filter="url(#shadow)">
    <!-- Phone shell -->
    <rect x="0" y="0" width="288" height="456" rx="42" fill="#03070c"/>
    <rect x="10" y="10" width="268" height="436" rx="34" fill="url(#phone)" stroke="#223242"/>
    <rect x="102" y="18" width="84" height="12" rx="6" fill="#111923"/>

    <!-- Airport hero -->
    <g transform="translate(20 38)">
      <rect width="248" height="118" rx="18" fill="url(#hero)" stroke="#1d3147"/>
      <rect x="0" y="0" width="3" height="118" rx="1.5" fill="#62b7f6"/>
      <!-- Left side: IATA badge + city + UTC -->
      <g transform="translate(12 14)">
        <rect width="48" height="28" rx="8" fill="#0a1721" stroke="#2c4a66"/>
        <text x="9" y="20" class="mono text" font-size="14" font-weight="900">HAN</text>
        <text x="56" y="20" class="mono dim" font-size="10" font-weight="800">VVNB</text>
        <text x="0" y="46" class="sans text" font-size="13" font-weight="800">Noi Bai International</text>
        <text x="0" y="62" class="mono muted" font-size="10">Tap to change airport</text>
      </g>
      <!-- Right side: UTC + LOC clock, gear icon overlap fixed -->
      <g transform="translate(150 16)">
        <text x="0" y="14" class="mono text" font-size="14" font-weight="900">15:24Z</text>
        <text x="0" y="30" class="mono blue" font-size="10" font-weight="700">22:24 LOC</text>
        <!-- Weather pill -->
        <rect x="0" y="40" width="86" height="34" rx="10" fill="#0c1622" stroke="#284866"/>
        <circle cx="14" cy="57" r="5" fill="#62b7f6" opacity="0.4"/>
        <text x="26" y="55" class="mono text" font-size="13" font-weight="900">25°C</text>
        <text x="26" y="68" class="mono dim" font-size="7" font-weight="800">PARTLY</text>
      </g>
      <!-- Gear icon (positioned outside clock to fix overlap) -->
      <circle cx="232" cy="14" r="13" fill="#1a8af0"/>
      <circle cx="232" cy="14" r="3" fill="#0d141d"/>
    </g>

    <!-- Status strip: LIVE / REAL / +30 -->
    <g transform="translate(20 162)">
      <rect x="0" y="0" width="40" height="20" rx="10" fill="#07351f" stroke="#146f3a"/>
      <circle cx="9" cy="10" r="3" fill="#22c55e"/>
      <text x="17" y="13" class="mono" fill="#22c55e" font-size="8" font-weight="900">LIVE</text>
      <rect x="46" y="0" width="38" height="20" rx="10" fill="#10283d" stroke="#244d6e"/>
      <text x="56" y="13" class="mono blue" font-size="8" font-weight="900">REAL</text>
      <rect x="90" y="0" width="32" height="20" rx="10" fill="#151e2a" stroke="#304158"/>
      <text x="98" y="13" class="mono muted" font-size="8" font-weight="900">↓30</text>
    </g>

    <!-- Pinned flight card with BOARDING + pin -->
    <g transform="translate(20 190)">
      <rect width="248" height="38" rx="14" fill="#0e151d" stroke="#1f3145"/>
      <text x="14" y="17" class="mono text" font-size="12" font-weight="900">CX 6630</text>
      <text x="14" y="29" class="mono muted" font-size="9">Hong Kong · 22:30</text>
      <text x="172" y="17" class="mono" fill="#f4b740" font-size="9" font-weight="900">BOARDING</text>
      <text x="172" y="29" class="mono blue tiny" font-weight="900">DETAIL</text>
      <circle cx="234" cy="19" r="9" fill="#101923" stroke="#356388"/>
      <text x="231" y="22" class="mono amber" font-size="9" font-weight="900">📌</text>
    </g>

    <!-- DEP/ARR toggle + list icon -->
    <g transform="translate(20 234)">
      <rect width="200" height="22" rx="11" fill="#101923" stroke="#1d2a39"/>
      <rect x="4" y="3" width="92" height="16" rx="8" fill="#173148" stroke="#356388"/>
      <text x="22" y="14" class="mono blue tiny" font-weight="900">DEPARTURES</text>
      <text x="120" y="14" class="mono dim tiny" font-weight="900">ARRIVALS</text>
      <rect x="208" y="0" width="40" height="22" rx="11" fill="#101923" stroke="#1d2a39"/>
      <line x1="218" y1="7" x2="232" y2="7" stroke="#62b7f6" stroke-width="1.5"/>
      <line x1="218" y1="11" x2="232" y2="11" stroke="#62b7f6" stroke-width="1.5"/>
      <line x1="218" y1="15" x2="232" y2="15" stroke="#62b7f6" stroke-width="1.5"/>
    </g>

    <!-- Column headers -->
    <g transform="translate(20 268)">
      <text x="0" y="0" class="mono dim tiny" font-weight="900">TIME</text>
      <text x="54" y="0" class="mono dim tiny" font-weight="900">FLIGHT</text>
      <text x="120" y="0" class="mono dim tiny" font-weight="900">TO</text>
      <text x="208" y="0" class="mono dim tiny" font-weight="900">STATUS</text>
    </g>

    <!-- Row 1: SCHEDULED with -10 early tag, GATE B35 -->
    <g transform="translate(20 277)">
      <rect width="248" height="48" rx="13" fill="#0f171f" stroke="#1b2836"/>
      <text x="6" y="18" class="mono text" font-size="13" font-weight="900">05:45</text>
      <rect x="4" y="22" width="22" height="13" rx="6" fill="#07351f"/>
      <text x="8" y="32" class="mono" fill="#22c55e" font-size="7" font-weight="900">-10</text>
      <text x="54" y="18" class="mono blue" font-size="12" font-weight="900">LX 1886</text>
      <text x="54" y="32" class="mono dim" font-size="8" font-weight="800">SWR1886</text>
      <text x="120" y="18" class="sans text" font-size="11" font-weight="800">Otopeni</text>
      <text x="120" y="30" class="mono muted" font-size="8">OTP</text>
      <rect x="200" y="14" width="46" height="18" rx="9" fill="#0a1f15" stroke="#1d6f40"/>
      <text x="207" y="26" class="mono" fill="#22c55e" font-size="7" font-weight="900">SCHEDULED</text>
      <text x="6" y="43" class="mono dim" font-size="7" font-weight="800">GATE</text>
      <text x="26" y="43" class="mono text" font-size="8" font-weight="900">B35</text>
    </g>

    <!-- Row 2: DELAYED +10 -->
    <g transform="translate(20 329)">
      <rect width="248" height="48" rx="13" fill="#0f171f" stroke="#1b2836"/>
      <text x="6" y="18" class="mono text" font-size="13" font-weight="900">05:55</text>
      <rect x="4" y="22" width="22" height="13" rx="6" fill="#3a1d05"/>
      <text x="9" y="32" class="mono amber" font-size="7" font-weight="900">+10</text>
      <text x="54" y="18" class="mono blue" font-size="12" font-weight="900">LX 1316</text>
      <text x="54" y="32" class="mono dim" font-size="8" font-weight="800">SWR1316</text>
      <text x="120" y="18" class="sans text" font-size="11" font-weight="800">Tallinn</text>
      <text x="120" y="30" class="mono muted" font-size="8">TLL</text>
      <rect x="200" y="14" width="46" height="18" rx="9" fill="#3a2705" stroke="#9c7515"/>
      <text x="211" y="26" class="mono amber" font-size="7" font-weight="900">DELAYED</text>
      <text x="6" y="43" class="mono dim" font-size="7" font-weight="800">GATE</text>
      <text x="26" y="43" class="mono text" font-size="8" font-weight="900">A71</text>
    </g>

    <!-- Row 3: DEPARTED green -->
    <g transform="translate(20 381)">
      <rect width="248" height="32" rx="13" fill="#0f171f" stroke="#1b2836"/>
      <text x="6" y="18" class="mono text" font-size="13" font-weight="900">06:00</text>
      <text x="54" y="18" class="mono blue" font-size="12" font-weight="900">WK 130</text>
      <text x="120" y="18" class="sans text" font-size="11" font-weight="800">Hurghada</text>
      <text x="120" y="28" class="mono muted" font-size="8">HRG</text>
      <rect x="200" y="9" width="46" height="18" rx="9" fill="#07351f"/>
      <text x="207" y="21" class="mono" fill="#22c55e" font-size="7" font-weight="900">DEPARTED</text>
    </g>

    <!-- Bottom nav (5 tabs) -->
    <g transform="translate(20 421)">
      <rect width="248" height="22" rx="11" fill="#0b1017" stroke="#243344"/>
      <circle cx="32" cy="11" r="9" fill="#102338" opacity="0.7"/>
      <text x="22" y="14" class="mono blue tiny" font-weight="900">✈</text>
      <circle cx="34" cy="20" r="1" fill="#62b7f6"/>
      <text x="22" y="22" class="mono blue tiny" font-weight="900" opacity="0">B</text>
      <text x="60" y="14" class="mono muted tiny">RADAR</text>
      <text x="108" y="14" class="mono muted tiny">HIST</text>
      <text x="158" y="14" class="mono muted tiny">CONTROL</text>
      <text x="216" y="14" class="mono muted tiny">HELP</text>
    </g>
  </g>
</svg>
