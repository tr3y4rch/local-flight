<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight mobile FIDS preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight Companion FIDS screen with airport hero, compact weather, and aligned rows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101822"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e8f0f8; }
      .muted { fill: #7f90a5; }
      .blue { fill: #62b7f6; }
      .dim { fill: #48647f; }
      .tiny { font-size: 9px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <g transform="translate(322 18) scale(1.1)" filter="url(#shadow)">
    <rect x="0" y="0" width="288" height="456" rx="42" fill="#03070c"/>
    <rect x="10" y="10" width="268" height="436" rx="34" fill="url(#phone)" stroke="#223242"/>
    <rect x="102" y="18" width="84" height="12" rx="6" fill="#111923"/>

    <g transform="translate(26 40)">
      <text x="0" y="0" class="mono blue" font-size="10" font-weight="900" letter-spacing="2">LOCAL FLIGHT</text>
      <text x="0" y="28" class="sans text" font-size="17" font-weight="900">Noi Bai</text>
      <text x="0" y="46" class="sans text" font-size="17" font-weight="900">International Airport</text>
      <text x="0" y="66" class="mono muted" font-size="11">HAN / VVNB - Vietnam</text>
      <text x="178" y="28" class="mono text" font-size="13" font-weight="900">15:24Z</text>
      <text x="178" y="46" class="mono blue" font-size="11">22:24 LOC</text>
      <rect x="178" y="58" width="58" height="34" rx="12" fill="#101b26" stroke="#284866"/>
      <text x="190" y="72" class="mono dim tiny" font-weight="900">WX</text>
      <text x="190" y="87" class="mono text" font-size="13" font-weight="900">25 C</text>

      <g transform="translate(0 92)">
        <rect x="0" y="0" width="58" height="22" rx="11" fill="#07351f" stroke="#146f3a"/>
        <circle cx="14" cy="11" r="4" fill="#22c55e"/>
        <text x="25" y="15" class="mono" fill="#22c55e" font-size="10" font-weight="900">LIVE</text>
        <rect x="68" y="0" width="50" height="22" rx="11" fill="#10283d" stroke="#244d6e"/>
        <text x="83" y="15" class="mono blue" font-size="10" font-weight="900">REAL</text>
        <rect x="128" y="0" width="56" height="22" rx="11" fill="#151e2a" stroke="#304158"/>
        <text x="143" y="15" class="mono muted" font-size="10" font-weight="900">17</text>
      </g>

      <rect x="0" y="132" width="236" height="40" rx="16" fill="#101923" stroke="#25425c"/>
      <text x="16" y="155" class="mono blue" font-size="14" font-weight="900">VN 356</text>
      <text x="78" y="155" class="sans text" font-size="13" font-weight="800">Fukuoka - 08:36</text>
      <rect x="184" y="141" width="40" height="22" rx="11" fill="#07351f"/>
      <text x="194" y="155" class="mono" fill="#22c55e" font-size="9" font-weight="900">PIN</text>

      <g transform="translate(0 190)">
        <rect x="0" y="0" width="236" height="34" rx="14" fill="#111922" stroke="#1d2a39"/>
        <rect x="6" y="6" width="110" height="22" rx="10" fill="#173148" stroke="#356388"/>
        <text x="26" y="21" class="mono blue tiny" font-weight="900">DEPARTURES</text>
        <text x="152" y="21" class="mono dim tiny" font-weight="900">ARRIVALS</text>
      </g>

      <g transform="translate(0 236)">
        <text x="0" y="0" class="mono dim tiny" font-weight="900">TIME</text>
        <text x="54" y="0" class="mono dim tiny" font-weight="900">FLIGHT</text>
        <text x="132" y="0" class="mono dim tiny" font-weight="900">TO</text>
        <text x="196" y="0" class="mono dim tiny" font-weight="900">STATUS</text>
      </g>

      <g transform="translate(0 247)">
        <rect width="236" height="44" rx="14" fill="#0f171f" stroke="#1b2836"/>
        <text x="0" y="27" class="mono text" font-size="13" font-weight="900">08:36</text>
        <text x="54" y="27" class="mono blue" font-size="12" font-weight="900">VN 356</text>
        <text x="132" y="20" class="sans text" font-size="12">Fukuoka</text>
        <text x="132" y="35" class="mono muted" font-size="9">FUK</text>
        <rect x="190" y="12" width="40" height="20" rx="9" fill="#10283d"/>
        <text x="198" y="25" class="mono blue" font-size="7" font-weight="900">DEP</text>
      </g>

      <g transform="translate(0 297)">
        <rect width="236" height="44" rx="14" fill="#0f171f" stroke="#1b2836"/>
        <text x="0" y="27" class="mono text" font-size="13" font-weight="900">08:38</text>
        <text x="54" y="27" class="mono blue" font-size="12" font-weight="900">HO1330</text>
        <text x="132" y="20" class="sans text" font-size="12">Shanghai</text>
        <text x="132" y="35" class="mono muted" font-size="9">PVG - G39</text>
        <rect x="190" y="12" width="40" height="20" rx="9" fill="#07351f"/>
        <text x="198" y="25" class="mono" fill="#22c55e" font-size="7" font-weight="900">ARR</text>
      </g>

      <g transform="translate(0 350)">
        <rect width="236" height="42" rx="18" fill="#0b1017" stroke="#243344"/>
        <text x="18" y="25" class="mono blue tiny" font-weight="900">FIDS</text>
        <text x="80" y="25" class="mono muted tiny">RADAR</text>
        <text x="151" y="25" class="mono muted tiny">HIST</text>
        <text x="205" y="25" class="mono muted tiny">SET</text>
      </g>
    </g>
  </g>
</svg>
