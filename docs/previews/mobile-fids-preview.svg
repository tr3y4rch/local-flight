<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight mobile FIDS preview</title>
  <desc id="desc">Illustrative preview of the Local Flight Companion FIDS screen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101822"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e7edf3; }
      .muted { fill: #7f90a5; }
      .tiny { font-size: 10px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <g transform="translate(322 20) scale(1.1)" filter="url(#shadow)">
    <rect x="0" y="0" width="288" height="456" rx="42" fill="#03070c"/>
    <rect x="10" y="10" width="268" height="436" rx="34" fill="url(#phone)" stroke="#223242"/>
    <rect x="102" y="18" width="84" height="12" rx="6" fill="#111923"/>

    <g transform="translate(26 42)">
      <text x="0" y="0" class="mono" fill="#4a9eda" font-size="11" font-weight="800" letter-spacing="2.2">LOCAL FLIGHT</text>
      <text x="0" y="34" class="sans text" font-size="30" font-weight="900">ZRH</text>
      <text x="74" y="34" class="mono muted" font-size="12">LSZH / LIVE REAL</text>
      <text x="174" y="34" class="mono muted" font-size="11">UTC 17:24</text>

      <rect x="0" y="52" width="236" height="42" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="18" cy="21" r="6" transform="translate(0 52)" fill="#22c55e"/>
      <text x="34" y="77" class="mono" fill="#22c55e" font-size="11" font-weight="800">FLIGHT ISLAND</text>
      <text x="34" y="93" class="sans text" font-size="13" font-weight="700">LX 1842 to Athens boarding at A62</text>

      <rect x="0" y="112" width="236" height="24" rx="12" fill="rgba(74,158,218,0.14)" stroke="rgba(74,158,218,0.22)"/>
      <text x="16" y="128" class="mono text tiny" font-weight="800">DEPARTURES</text>
      <text x="140" y="128" class="mono muted tiny">PINNED FIRST</text>

      <g transform="translate(0 154)">
        <rect width="236" height="54" rx="16" fill="#0e151d" stroke="#243344"/>
        <text x="16" y="21" class="mono text" font-size="17" font-weight="800">17:35</text>
        <text x="84" y="21" class="mono text" font-size="15" font-weight="800">LX 1842</text>
        <text x="16" y="39" class="sans text" font-size="13">Athens</text>
        <rect x="144" y="12" width="76" height="22" rx="11" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)"/>
        <text x="157" y="27" class="mono" fill="#22c55e" font-size="10" font-weight="900">BOARDING</text>
        <text x="16" y="48" class="mono muted tiny">A62  A320  PINNED</text>
      </g>

      <g transform="translate(0 218)">
        <rect width="236" height="54" rx="16" fill="#0e151d" stroke="#243344"/>
        <text x="16" y="21" class="mono text" font-size="17" font-weight="800">17:50</text>
        <text x="84" y="21" class="mono text" font-size="15" font-weight="800">BA 713</text>
        <text x="16" y="39" class="sans text" font-size="13">London Heathrow</text>
        <rect x="136" y="12" width="84" height="22" rx="11" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)"/>
        <text x="149" y="27" class="mono" fill="#f59e0b" font-size="10" font-weight="900">APPROACH</text>
        <text x="16" y="48" class="mono muted tiny">B04  A319</text>
      </g>

      <g transform="translate(0 282)">
        <rect width="236" height="54" rx="16" fill="#0e151d" stroke="#243344"/>
        <text x="16" y="21" class="mono text" font-size="17" font-weight="800">18:05</text>
        <text x="84" y="21" class="mono text" font-size="15" font-weight="800">LH 2369</text>
        <text x="16" y="39" class="sans text" font-size="13">Munich</text>
        <rect x="150" y="12" width="70" height="22" rx="11" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)"/>
        <text x="164" y="27" class="mono" fill="#ef4444" font-size="10" font-weight="900">DELAYED</text>
        <text x="16" y="48" class="mono muted tiny">D18  E195</text>
      </g>

      <g transform="translate(0 360)">
        <rect width="236" height="42" rx="18" fill="#0b1017" stroke="#243344"/>
        <text x="18" y="26" class="mono text tiny" font-weight="800">FIDS</text>
        <text x="70" y="26" class="mono muted tiny">RADAR</text>
        <text x="128" y="26" class="mono muted tiny">HISTORY</text>
        <text x="198" y="26" class="mono muted tiny">SET</text>
      </g>
    </g>
  </g>
</svg>
