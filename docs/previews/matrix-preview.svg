<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight Matrix preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight Matrix board configurator and LED passenger display tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="0.58" stop-color="#10161d"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e8f0f8; }
      .muted { fill: #7890aa; }
      .green { fill: #45d483; }
      .amber { fill: #f8c15c; }
      .blue { fill: #62b7f6; }
      .tiny { font-size: 11px; letter-spacing: 1.1px; }
      .label { fill: #7890aa; font-size: 12px; font-weight: 900; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="924" height="504" rx="22" fill="url(#panel)" stroke="#27364a" filter="url(#shadow)"/>

  <rect x="18" y="18" width="924" height="46" rx="22" fill="#070c12"/>
  <rect x="18" y="42" width="924" height="22" fill="#070c12"/>
  <text x="42" y="47" class="sans text" font-size="16" font-weight="900">Local Flight</text>
  <text x="138" y="47" class="mono muted tiny">v0.2.6</text>
  <text x="548" y="46" class="mono muted tiny">FIDS</text>
  <text x="620" y="46" class="mono muted tiny">RADAR</text>
  <rect x="700" y="29" width="82" height="24" rx="12" fill="#1e3449" stroke="#31516e"/>
  <text x="718" y="46" class="mono text tiny" font-weight="900">MATRIX</text>
  <text x="804" y="46" class="mono muted tiny">SETTINGS</text>

  <g transform="translate(42 88)">
    <text x="0" y="0" class="sans text" font-size="25" font-weight="900">Matrix Board</text>
    <text x="154" y="0" class="mono muted" font-size="13">Interstate 75 W / HUB75 runtime</text>
    <rect x="654" y="-24" width="222" height="30" rx="15" fill="#0d2f1d" stroke="#146f3a"/>
    <circle cx="674" cy="-9" r="4" fill="#22c55e"/>
    <text x="688" y="-4" class="mono" fill="#9ff7bd" font-size="12" font-weight="900">DEVICE CHECKED IN</text>

    <rect x="0" y="30" width="876" height="184" rx="18" fill="#05080b" stroke="#2b3849"/>
    <rect x="28" y="54" width="512" height="128" rx="8" fill="#020403" stroke="#1b2b25"/>
    <g transform="translate(44 70)">
      <text x="0" y="0" class="mono green" font-size="16" font-weight="900">HANOI DEP</text>
      <text x="364" y="0" class="mono" fill="#78968a" font-size="14">22:24 LOC</text>
      <line x1="0" y1="14" x2="480" y2="14" stroke="#123825"/>
      <text x="0" y="42" class="mono green" font-size="17" font-weight="900">08:36  VN356</text>
      <text x="168" y="42" class="mono text" font-size="17" font-weight="900">FUKUOKA FUK</text>
      <text x="382" y="42" class="mono green" font-size="17" font-weight="900">DEP</text>
      <line x1="0" y1="57" x2="480" y2="57" stroke="#0c251a"/>
      <text x="0" y="84" class="mono green" font-size="17" font-weight="900">08:38  HO1330</text>
      <text x="168" y="84" class="mono text" font-size="17" font-weight="900">SHANGHAI PVG</text>
      <text x="382" y="84" class="mono amber" font-size="17" font-weight="900">ARR</text>
    </g>

    <g transform="translate(580 54)">
      <text x="0" y="0" class="mono label">RUNTIME</text>
      <rect x="0" y="18" width="268" height="32" rx="10" fill="#101923" stroke="#25364a"/>
      <text x="14" y="39" class="mono text" font-size="12" font-weight="900">Preset</text>
      <text x="112" y="39" class="mono blue" font-size="12">real_fids</text>
      <rect x="0" y="62" width="268" height="32" rx="10" fill="#101923" stroke="#25364a"/>
      <text x="14" y="83" class="mono text" font-size="12" font-weight="900">Panel</text>
      <text x="112" y="83" class="mono blue" font-size="12">256 x 64</text>
      <rect x="0" y="106" width="126" height="32" rx="10" fill="#0d2f1d" stroke="#146f3a"/>
      <text x="17" y="127" class="mono green" font-size="11" font-weight="900">WEATHER ON</text>
      <rect x="140" y="106" width="128" height="32" rx="10" fill="#2a1d09" stroke="#75511a"/>
      <text x="156" y="127" class="mono amber" font-size="11" font-weight="900">SPLIT FLAP</text>
    </g>

    <g transform="translate(0 248)">
      <rect x="0" y="0" width="206" height="112" rx="16" fill="#101923" stroke="#25364a"/>
      <text x="18" y="30" class="mono label">STATUS</text>
      <text x="18" y="58" class="sans text" font-size="15" font-weight="800">Sync ready</text>
      <text x="18" y="82" class="sans muted" font-size="13">Last ping 18 sec ago.</text>

      <rect x="224" y="0" width="206" height="112" rx="16" fill="#101923" stroke="#25364a"/>
      <text x="242" y="30" class="mono label">LOOK</text>
      <text x="242" y="58" class="sans text" font-size="15" font-weight="800">Passenger green</text>
      <text x="242" y="82" class="sans muted" font-size="13">Palette preview stays live.</text>

      <rect x="448" y="0" width="206" height="112" rx="16" fill="#101923" stroke="#25364a"/>
      <text x="466" y="30" class="mono label">MOTION</text>
      <text x="466" y="58" class="sans text" font-size="15" font-weight="800">Rows rotate</text>
      <text x="466" y="82" class="sans muted" font-size="13">Codeshares cycle safely.</text>

      <rect x="672" y="0" width="204" height="112" rx="16" fill="#101923" stroke="#25364a"/>
      <text x="690" y="30" class="mono label">CLIENT</text>
      <text x="690" y="58" class="sans text" font-size="15" font-weight="800">Download main.py</text>
      <text x="690" y="82" class="sans muted" font-size="13">Generated from current config.</text>
    </g>
  </g>

  <text x="42" y="501" class="mono muted tiny">Illustrative sample data - public presets: real_fids, vatsim_pilot, vatsim_atc</text>
</svg>
