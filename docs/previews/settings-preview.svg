<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight settings preview</title>
  <desc id="desc">Illustrative preview of the Local Flight desktop settings page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#111821"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .muted { fill: #78899d; }
      .text { fill: #e7edf3; }
      .tiny { font-size: 11px; letter-spacing: 1px; }
      .label { fill: #dfe8f2; font-size: 13px; font-weight: 800; }
      .hint { fill: #74869b; font-size: 12px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="924" height="504" rx="22" fill="#0d1218" stroke="#233041"/>

  <rect x="18" y="18" width="924" height="44" rx="22" fill="#0b1017"/>
  <rect x="18" y="40" width="924" height="22" fill="#0b1017"/>
  <text x="42" y="47" class="sans text" font-size="16" font-weight="800">Local Flight</text>
  <text x="137" y="47" class="mono muted tiny">v0.2.5b3</text>
  <text x="574" y="46" class="mono muted tiny">FIDS</text>
  <text x="646" y="46" class="mono muted tiny">RADAR</text>
  <text x="724" y="46" class="mono muted tiny">HISTORY</text>
  <rect x="804" y="29" width="86" height="24" rx="12" fill="#1f2d3d"/>
  <text x="821" y="46" class="mono text tiny" font-weight="800">SETTINGS</text>

  <g transform="translate(150 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="660" height="398" rx="20" fill="#121923" stroke="#263445"/>
    <text x="26" y="42" class="sans text" font-size="25" font-weight="800">Local Flight</text>
    <text x="26" y="65" class="mono muted" font-size="13">ZRH / LSZH - real - standard</text>

    <g transform="translate(24 92)">
      <rect x="0" y="0" width="612" height="104" rx="16" fill="#0f151d" stroke="#253142"/>
      <text x="18" y="27" class="sans text" font-size="16" font-weight="800">Current</text>
      <g class="sans" font-size="13">
        <text x="18" y="57" class="label">Airport</text>
        <text x="18" y="78" class="muted">ZRH / LSZH</text>
        <text x="142" y="57" class="label">Refresh</text>
        <text x="142" y="78" class="muted">3600s</text>
        <text x="268" y="57" class="label">Source</text>
        <text x="268" y="78" class="muted">Configured: real</text>
        <text x="414" y="57" class="label">Connection</text>
        <text x="414" y="78" fill="#22c55e" font-weight="900">OK</text>
      </g>
      <rect x="478" y="28" width="112" height="38" rx="12" fill="#1a2431" stroke="#34475d"/>
      <text x="496" y="52" class="sans text" font-size="13" font-weight="800">Restart</text>
    </g>

    <g transform="translate(24 214)">
      <rect x="0" y="0" width="238" height="144" rx="16" fill="#0f151d" stroke="#253142"/>
      <text x="18" y="28" class="sans text" font-size="16" font-weight="800">Profiles</text>
      <rect x="18" y="46" width="132" height="32" rx="10" fill="#111b26" stroke="#2c3d51"/>
      <text x="31" y="67" class="mono muted" font-size="12">LSZH_day</text>
      <rect x="160" y="46" width="56" height="32" rx="10" fill="#1a2431" stroke="#34475d"/>
      <text x="175" y="67" class="sans text" font-size="12" font-weight="800">Load</text>
      <rect x="18" y="94" width="198" height="32" rx="10" fill="#111b26" stroke="#2c3d51"/>
      <text x="31" y="115" class="mono muted" font-size="12">Save current profile</text>
    </g>

    <g transform="translate(282 214)">
      <rect x="0" y="0" width="354" height="144" rx="16" fill="#0f151d" stroke="#253142"/>
      <text x="18" y="28" class="sans text" font-size="16" font-weight="800">Settings</text>
      <text x="18" y="56" class="label sans">Airport</text>
      <rect x="88" y="38" width="238" height="30" rx="10" fill="#111b26" stroke="#2c3d51"/>
      <text x="102" y="58" class="mono muted" font-size="12">Zurich, ZRH, LSZH</text>
      <text x="18" y="93" class="label sans">Source</text>
      <rect x="88" y="75" width="96" height="30" rx="10" fill="#111b26" stroke="#2c3d51"/>
      <text x="105" y="95" class="mono muted" font-size="12">real</text>
      <text x="202" y="93" class="label sans">Update</text>
      <rect x="262" y="75" width="64" height="30" rx="10" fill="#111b26" stroke="#2c3d51"/>
      <text x="274" y="95" class="mono muted" font-size="12">60m</text>
      <rect x="18" y="114" width="58" height="18" rx="9" fill="#1a1d22" stroke="#e7edf3" opacity="0.9"/>
      <rect x="84" y="114" width="58" height="18" rx="9" fill="#0a0e14" stroke="#4a9eda"/>
      <rect x="150" y="114" width="58" height="18" rx="9" fill="#000d00" stroke="#00ff50"/>
      <rect x="216" y="114" width="58" height="18" rx="9" fill="#00080f" stroke="#00ccff"/>
      <rect x="282" y="114" width="44" height="18" rx="9" fill="#0a0600" stroke="#ffaa00"/>
    </g>
  </g>

  <text x="42" y="499" class="mono muted tiny">README preview - illustrative sample data, not live telemetry</text>
</svg>
