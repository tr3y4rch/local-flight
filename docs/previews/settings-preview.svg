<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight native settings preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight native settings control-room page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e8f0f8; }
      .muted { fill: #7890aa; }
      .blue { fill: #62b7f6; }
      .tiny { font-size: 11px; letter-spacing: 1.1px; }
      .label { fill: #e8f0f8; font-size: 13px; font-weight: 900; }
      .hint { fill: #7890aa; font-size: 12px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="924" height="504" rx="22" fill="#0d1218" stroke="#27364a"/>

  <rect x="18" y="18" width="924" height="46" rx="22" fill="#070c12"/>
  <rect x="18" y="42" width="924" height="22" fill="#070c12"/>
  <text x="42" y="47" class="sans text" font-size="16" font-weight="900">Local Flight</text>
  <text x="138" y="47" class="mono muted tiny">v0.2.5</text>
  <text x="548" y="46" class="mono muted tiny">FIDS</text>
  <text x="620" y="46" class="mono muted tiny">RADAR</text>
  <text x="696" y="46" class="mono muted tiny">MATRIX</text>
  <rect x="784" y="29" width="92" height="24" rx="12" fill="#1e3449" stroke="#31516e"/>
  <text x="805" y="46" class="mono text tiny" font-weight="900">SETTINGS</text>

  <g transform="translate(66 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="828" height="398" rx="22" fill="#101721" stroke="#26384d"/>
    <text x="26" y="42" class="sans text" font-size="27" font-weight="900">Settings</text>
    <text x="26" y="66" class="mono muted" font-size="13">Control room - apply changes when ready</text>
    <rect x="650" y="24" width="146" height="38" rx="14" fill="#1f6f3a" stroke="#2ea85c"/>
    <text x="678" y="48" class="mono" fill="#071009" font-size="12" font-weight="900">APPLY SETTINGS</text>

    <g transform="translate(26 96)">
      <rect x="0" y="0" width="370" height="126" rx="18" fill="#0d141d" stroke="#25364a"/>
      <text x="18" y="29" class="mono blue tiny" font-weight="900">CURRENT AIRPORT</text>
      <text x="18" y="60" class="sans text" font-size="21" font-weight="900">Noi Bai International</text>
      <text x="18" y="84" class="mono muted" font-size="13">HAN / VVNB - source real - standard skin</text>
      <rect x="18" y="98" width="82" height="20" rx="10" fill="#07351f"/>
      <text x="37" y="112" class="mono" fill="#22c55e" font-size="10" font-weight="900">ONLINE</text>
      <rect x="110" y="98" width="122" height="20" rx="10" fill="#13283a"/>
      <text x="128" y="112" class="mono blue" font-size="10" font-weight="900">60 MIN LOCAL</text>

      <rect x="392" y="0" width="384" height="126" rx="18" fill="#0d141d" stroke="#25364a"/>
      <text x="410" y="29" class="mono blue tiny" font-weight="900">PROFILE CONTROLS</text>
      <rect x="410" y="46" width="154" height="34" rx="11" fill="#111c27" stroke="#2c4259"/>
      <text x="426" y="68" class="mono muted" font-size="12">HAN-evening</text>
      <rect x="574" y="46" width="72" height="34" rx="11" fill="#17283a" stroke="#31516e"/>
      <text x="596" y="68" class="mono text" font-size="12" font-weight="900">LOAD</text>
      <rect x="656" y="46" width="100" height="34" rx="11" fill="#17283a" stroke="#31516e"/>
      <text x="677" y="68" class="mono text" font-size="12" font-weight="900">SAVE NEW</text>
      <text x="410" y="105" class="sans hint">Profiles switch airports without hiding what will be applied.</text>
    </g>

    <g transform="translate(26 246)">
      <rect x="0" y="0" width="248" height="102" rx="18" fill="#0d141d" stroke="#25364a"/>
      <text x="18" y="29" class="mono blue tiny" font-weight="900">DATA ACCESS</text>
      <text x="18" y="58" class="sans label">Community relay</text>
      <text x="18" y="80" class="sans hint">Shared snapshot cadence explained.</text>

      <rect x="264" y="0" width="248" height="102" rx="18" fill="#0d141d" stroke="#25364a"/>
      <text x="282" y="29" class="mono blue tiny" font-weight="900">RADAR SURFACE</text>
      <text x="282" y="58" class="sans label">Runways + surface on</text>
      <text x="282" y="80" class="sans hint">Map prep feedback stays visible.</text>

      <rect x="528" y="0" width="248" height="102" rx="18" fill="#0d141d" stroke="#25364a"/>
      <text x="546" y="29" class="mono blue tiny" font-weight="900">COLLAPSED HELP</text>
      <text x="546" y="58" class="sans label">Diagnostics + advanced</text>
      <text x="546" y="80" class="sans hint">Low-frequency controls stay tucked away.</text>
    </g>

    <text x="26" y="376" class="mono muted tiny">GitHub - Buy Me a Coffee - Re-run setup wizard - local docs bundled in app</text>
  </g>

  <text x="42" y="501" class="mono muted tiny">Illustrative sample data - native settings uses explicit apply/save feedback</text>
</svg>
