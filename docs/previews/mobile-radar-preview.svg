<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight mobile radar preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight Companion radar screen with mobile-owned rings and server-mediated ground drawing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131d"/>
      <stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#102131"/>
      <stop offset="0.56" stop-color="#08111a"/>
      <stop offset="1" stop-color="#020508"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9eda" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a9eda" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e8f0f8; }
      .muted { fill: #7f90a5; }
      .blue { fill: #62b7f6; }
      .tiny { font-size: 9px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <g transform="translate(322 18) scale(1.1)" filter="url(#shadow)">
    <rect x="0" y="0" width="288" height="456" rx="42" fill="#03070c"/>
    <rect x="10" y="10" width="268" height="436" rx="34" fill="#0d141c" stroke="#223242"/>
    <rect x="102" y="18" width="84" height="12" rx="6" fill="#111923"/>

    <g transform="translate(26 40)">
      <text x="0" y="0" class="mono blue" font-size="10" font-weight="900" letter-spacing="2">LOCAL FLIGHT</text>
      <text x="0" y="29" class="sans text" font-size="25" font-weight="900">RADAR</text>
      <text x="94" y="29" class="mono muted" font-size="11">HAN  5 NM</text>

      <rect x="0" y="45" width="236" height="56" rx="16" fill="#101923" stroke="#25425c"/>
      <rect x="14" y="12" width="38" height="20" rx="10" fill="#07351f" stroke="#146f3a" transform="translate(0 45)"/>
      <text x="25" y="70" class="mono" fill="#22c55e" font-size="9" font-weight="900">VFR</text>
      <text x="64" y="67" class="mono text" font-size="10" font-weight="900">25 C - light decoding</text>
      <text x="64" y="84" class="mono muted" font-size="9">Wind 080/6 - QNH 1012</text>

      <g transform="translate(0 114)">
        <rect x="0" y="0" width="26" height="20" rx="10" fill="#14202c" stroke="#30445b"/>
        <text x="9" y="14" class="mono muted" font-size="8" font-weight="900">1</text>
        <rect x="32" y="0" width="26" height="20" rx="10" fill="#14202c" stroke="#30445b"/>
        <text x="41" y="14" class="mono muted" font-size="8" font-weight="900">2</text>
        <rect x="64" y="0" width="26" height="20" rx="10" fill="#14202c" stroke="#30445b"/>
        <text x="73" y="14" class="mono muted" font-size="8" font-weight="900">3</text>
        <rect x="96" y="0" width="30" height="20" rx="10" fill="#173148" stroke="#356388"/>
        <text x="106" y="14" class="mono blue" font-size="8" font-weight="900">5</text>
        <rect x="132" y="0" width="34" height="20" rx="10" fill="#14202c" stroke="#30445b"/>
        <text x="140" y="14" class="mono muted" font-size="8" font-weight="900">10</text>
        <rect x="172" y="0" width="34" height="20" rx="10" fill="#14202c" stroke="#30445b"/>
        <text x="180" y="14" class="mono muted" font-size="8" font-weight="900">20</text>
        <rect x="212" y="0" width="24" height="20" rx="10" fill="#14202c" stroke="#30445b"/>
        <text x="216" y="14" class="mono muted" font-size="8" font-weight="900">40</text>
      </g>

      <g transform="translate(118 252)">
        <circle r="112" fill="url(#radar)" stroke="#284866" stroke-width="2"/>
        <path d="M-72 54 L74 -32" stroke="#d8d1b4" stroke-width="6" stroke-linecap="round"/>
        <path d="M-72 54 L74 -32" stroke="#0c1118" stroke-width="1.5" stroke-dasharray="8 6"/>
        <path d="M-34 72 L22 -86" stroke="#d8d1b4" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
        <path d="M-56 32 L-12 12 L34 28 L72 8" fill="none" stroke="#70c38b" stroke-width="2" opacity="0.46"/>
        <circle r="84" fill="none" stroke="#326185" stroke-opacity="0.28"/>
        <circle r="56" fill="none" stroke="#326185" stroke-opacity="0.26"/>
        <circle r="28" fill="none" stroke="#326185" stroke-opacity="0.24"/>
        <line x1="-112" y1="0" x2="112" y2="0" stroke="#326185" stroke-opacity="0.24" stroke-dasharray="5 7"/>
        <line x1="0" y1="-112" x2="0" y2="112" stroke="#326185" stroke-opacity="0.24" stroke-dasharray="5 7"/>
        <path d="M0 0 L0 -112 A112 112 0 0 1 96 -56 Z" fill="url(#sweep)"/>
        <line x1="0" y1="0" x2="0" y2="-112" stroke="#62b7f6" stroke-width="2"/>
        <circle r="4" fill="#d8ecff"/>
        <circle cx="-48" cy="-36" r="4" fill="#ffffff"/>
        <circle cx="34" cy="-58" r="4" fill="#ffffff"/>
        <circle cx="58" cy="22" r="4" fill="#ffffff"/>
        <circle cx="-30" cy="18" r="3" fill="#22c55e"/>
        <text x="-42" y="-42" class="mono text tiny">HVN356</text>
        <text x="43" y="-62" class="mono text tiny">QTR8959</text>
        <text x="66" y="18" class="mono text tiny">VJC920</text>
      </g>

      <rect x="0" y="384" width="236" height="28" rx="14" fill="#101923" stroke="#25425c"/>
      <circle cx="18" cy="398" r="4" fill="#22c55e"/>
      <text x="31" y="402" class="mono muted" font-size="9">Ground layer from server</text>
    </g>
  </g>
</svg>
