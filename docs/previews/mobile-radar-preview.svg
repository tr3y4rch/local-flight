<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight mobile radar preview</title>
  <desc id="desc">Illustrative preview of the Local Flight Companion radar screen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131d"/>
      <stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#102131"/>
      <stop offset="0.55" stop-color="#08111a"/>
      <stop offset="1" stop-color="#020508"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9eda" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a9eda" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e7edf3; }
      .muted { fill: #7f90a5; }
      .tiny { font-size: 10px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <g transform="translate(322 20) scale(1.1)" filter="url(#shadow)">
    <rect x="0" y="0" width="288" height="456" rx="42" fill="#03070c"/>
    <rect x="10" y="10" width="268" height="436" rx="34" fill="#0d141c" stroke="#223242"/>
    <rect x="102" y="18" width="84" height="12" rx="6" fill="#111923"/>

    <g transform="translate(26 40)">
      <text x="0" y="0" class="mono" fill="#4a9eda" font-size="11" font-weight="800" letter-spacing="2.2">LOCAL FLIGHT</text>
      <text x="0" y="30" class="sans text" font-size="26" font-weight="900">RADAR</text>
      <text x="96" y="30" class="mono muted" font-size="12">ZRH  40 NM</text>

      <rect x="0" y="48" width="236" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="18" cy="62" r="5" fill="#22c55e"/>
      <text x="32" y="66" class="mono" fill="#22c55e" font-size="10" font-weight="800">ADS-B EXCHANGE LIVE</text>

      <g transform="translate(118 208)">
        <circle r="112" fill="url(#radar)" stroke="rgba(74,158,218,0.26)" stroke-width="2"/>
        <circle r="84" fill="none" stroke="rgba(74,158,218,0.16)"/>
        <circle r="56" fill="none" stroke="rgba(74,158,218,0.16)"/>
        <circle r="28" fill="none" stroke="rgba(74,158,218,0.16)"/>
        <line x1="-112" y1="0" x2="112" y2="0" stroke="rgba(74,158,218,0.16)" stroke-dasharray="5 7"/>
        <line x1="0" y1="-112" x2="0" y2="112" stroke="rgba(74,158,218,0.16)" stroke-dasharray="5 7"/>
        <path d="M0 0 L0 -112 A112 112 0 0 1 96 -56 Z" fill="url(#sweep)"/>
        <line x1="0" y1="0" x2="0" y2="-112" stroke="#4a9eda" stroke-width="2"/>
        <circle r="4" fill="#d8ecff"/>
        <circle cx="-52" cy="-38" r="4" fill="#ffffff"/>
        <circle cx="36" cy="-58" r="4" fill="#ffffff"/>
        <circle cx="62" cy="22" r="4" fill="#ffffff"/>
        <circle cx="-74" cy="48" r="3" fill="#a7d5ff"/>
        <text x="-44" y="-42" class="mono text tiny">SWR1842</text>
        <text x="44" y="-62" class="mono text tiny">BAW713</text>
        <text x="70" y="18" class="mono text tiny">DLH2369</text>
      </g>

      <rect x="0" y="344" width="236" height="44" rx="16" fill="#0e151d" stroke="#243344"/>
      <text x="16" y="362" class="mono muted tiny">BLIPS</text>
      <text x="16" y="380" class="mono text" font-size="16" font-weight="800">9</text>
      <text x="86" y="362" class="mono muted tiny">SOURCE</text>
      <text x="86" y="380" class="mono" fill="#22c55e" font-size="12" font-weight="800">ADSBX</text>
      <text x="164" y="362" class="mono muted tiny">RANGE</text>
      <text x="164" y="380" class="mono text" font-size="12" font-weight="800">40 NM</text>
    </g>
  </g>
</svg>
