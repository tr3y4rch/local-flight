<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight Matrix preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight native Qt Matrix page with i75W setup assistant, saved board config controls, live HUB75 preview, weather/gate rules, and generated main.py workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a10"/>
      <stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .text { fill: #edf5ff; }
      .soft { fill: #89d4ff; }
      .muted { fill: #6f88a2; }
      .dim { fill: #445a72; }
      .cyan { fill: #58dcff; }
      .amber { fill: #ffc44d; }
      .tiny { font-size: 8px; letter-spacing: 1.1px; }
      .label { font-size: 10px; font-weight: 800; letter-spacing: 1px; }
      .kicker { fill: #4f93c8; font-size: 8px; letter-spacing: 1.8px; font-weight: 900; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#202020"/>
  <rect y="12" width="960" height="528" fill="url(#bg)"/>
  <rect y="12" width="960" height="30" fill="#090e14" stroke="#1a2531"/>
  <text x="23" y="32" class="sans text" font-size="13" font-weight="900">Local Flight</text>
  <text x="82" y="32" class="mono soft" font-size="7">v0.2.7</text>
  <g transform="translate(108 18)" class="mono label">
    <text x="13" y="15" class="soft">Display</text><text x="63" y="15" class="soft">FIDS</text><text x="106" y="15" class="soft">Radar</text>
  </g>
  <g transform="translate(366 18)">
    <rect x="0" y="0" width="62" height="22" rx="7" fill="#0d2034" stroke="#2d5f8c"/><text x="9" y="15" class="mono soft" font-size="10">UTC 16:02</text>
    <rect x="68" y="0" width="58" height="22" rx="7" fill="#0d2034" stroke="#2d5f8c"/><text x="78" y="15" class="mono soft" font-size="10">LT 18:02</text>
  </g>
  <g transform="translate(628 18)" class="mono label">
    <rect x="0" y="0" width="42" height="22" rx="5" fill="#10263b" stroke="#45a5ea"/><text x="12" y="15" fill="#5ee5a0">Matrix</text>
    <text x="58" y="15" class="soft">Settings</text><text x="112" y="15" class="soft">Admin</text><text x="160" y="15" class="soft">History</text><text x="216" y="15" class="soft">Logs</text><text x="262" y="15" class="soft">Report</text>
    <rect x="314" y="0" width="36" height="22" rx="5" fill="#08111a" stroke="#2d5f8c"/><text x="324" y="15" class="soft">Power</text>
  </g>

  <g transform="translate(9 52)">
    <rect width="942" height="34" rx="7" fill="#0f1823" stroke="#23466a"/>
    <text x="15" y="22" class="sans text" font-size="13" font-weight="900">Matrix</text>
    <text x="78" y="22" class="sans soft" font-size="9">Configure Interstate 75 W / HUB75 display behavior without touching provider keys.</text>
  </g>

  <g transform="translate(9 94)">
    <rect width="942" height="151" rx="8" fill="#0f1823" stroke="#23466a"/>
    <text x="8" y="16" class="mono kicker">I75W SETUP ASSISTANT</text>
    <g transform="translate(8 28)">
      <rect x="0" y="0" width="220" height="70" rx="8" fill="#101820" stroke="#23466a"/>
      <text x="8" y="15" class="mono kicker">1 CHOOSE PANEL</text>
      <text x="8" y="36" class="sans text" font-size="14" font-weight="900">Pick the HUB75 panel combo you</text>
      <text x="8" y="56" class="sans text" font-size="14" font-weight="900">wired, or enter a custom size.</text>
      <rect x="226" y="0" width="220" height="70" rx="8" fill="#101820" stroke="#23466a"/>
      <text x="234" y="15" class="mono kicker">2 TUNE PREVIEW</text>
      <text x="234" y="36" class="sans text" font-size="14" font-weight="900">Rows, brightness, palette, motion,</text>
      <text x="234" y="56" class="sans text" font-size="14" font-weight="900">weather, and gate labels update.</text>
      <rect x="452" y="0" width="240" height="70" rx="8" fill="#101820" stroke="#23466a"/>
      <text x="460" y="15" class="mono kicker">3 APPLY LIVE CONFIG</text>
      <text x="460" y="36" class="sans text" font-size="14" font-weight="900">Save the board config. A flashed v2</text>
      <text x="460" y="56" class="sans text" font-size="14" font-weight="900">board picks it up over Wi-Fi.</text>
      <rect x="698" y="0" width="228" height="70" rx="8" fill="#101820" stroke="#23466a"/>
      <text x="706" y="15" class="mono kicker">4 GENERATE MAIN.PY</text>
      <text x="706" y="36" class="sans text" font-size="14" font-weight="900">Regenerate only when Wi-Fi, server,</text>
      <text x="706" y="56" class="sans text" font-size="14" font-weight="900">wiring, or client code changes.</text>
    </g>
    <g transform="translate(8 104)">
      <rect x="0" y="0" width="456" height="36" rx="7" fill="#101820" stroke="#23466a"/>
      <text x="8" y="13" class="mono kicker">LIVE AFTER APPLY</text>
      <text x="8" y="29" class="sans text" font-size="13" font-weight="900">Board mode, Palette/style, Brightness, Rows shown</text>
      <rect x="472" y="0" width="454" height="36" rx="7" fill="#101820" stroke="#23466a"/>
      <text x="480" y="13" class="mono kicker">REGENERATE MAIN.PY WHEN</text>
      <text x="480" y="29" class="sans text" font-size="13" font-weight="900">Wi-Fi network, Local Flight server, physical panel size</text>
    </g>
  </g>

  <g transform="translate(9 252)">
    <rect x="0" y="0" width="312" height="264" rx="8" fill="#0f1823" stroke="#23466a"/>
    <text x="8" y="16" class="mono kicker">BOARD SETUP</text>
    <text x="8" y="31" class="sans soft" font-size="9">These controls change the saved config and preview immediately.</text>
    <g transform="translate(8 44)" class="sans" font-size="9">
      <text x="0" y="0" class="text">Selected config</text><rect x="82" y="-10" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="-1" class="mono text" font-size="8">Default Board *</text>
      <text x="0" y="21" class="text">Config name</text><rect x="82" y="11" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="20" class="mono text" font-size="8">Default Board</text>
      <text x="0" y="42" class="text">Board mode</text><rect x="82" y="32" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="41" class="mono text" font-size="8">Real FIDS</text>
      <text x="0" y="63" class="text">Panel combo</text><rect x="82" y="53" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="62" class="mono text" font-size="8">Custom size</text>
      <text x="0" y="84" class="text">Custom size</text><rect x="82" y="74" width="64" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="86" y="83" class="mono text" font-size="8">256 px</text><text x="150" y="84" class="text">x</text><rect x="162" y="74" width="58" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="166" y="83" class="mono text" font-size="8">64 px</text>
      <text x="0" y="105" class="text">Startup lane</text><rect x="82" y="95" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="104" class="mono text" font-size="8">Departures first</text>
      <text x="0" y="126" class="text">Rows shown</text><rect x="82" y="116" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="125" class="mono text" font-size="8">4</text>
      <text x="0" y="147" class="text">Refresh</text><rect x="82" y="137" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="146" class="mono text" font-size="8">60s</text>
      <text x="0" y="168" class="text">Brightness</text><rect x="82" y="158" width="238" height="6" rx="3" fill="#050a10"/><rect x="82" y="158" width="190" height="6" rx="3" fill="#4aa3df"/>
      <text x="0" y="189" class="text">Palette</text><rect x="82" y="179" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="188" class="mono text" font-size="8">pax_blue</text>
      <text x="0" y="210" class="text">Motion</text><rect x="82" y="200" width="238" height="12" rx="5" fill="#07111b" stroke="#2e5b82"/><text x="85" y="209" class="mono text" font-size="8">Split-flap animation</text>
      <rect x="0" y="224" width="296" height="14" fill="#050a10"/><text x="10" y="234" class="text">Pulse active statuses</text>
      <rect x="0" y="244" width="296" height="14" fill="#050a10"/><text x="10" y="254" class="text">Weather strip/page + Gate/stand info</text>
    </g>

    <rect x="326" y="0" width="616" height="264" rx="8" fill="#0f1823" stroke="#23466a"/>
    <text x="334" y="16" class="mono kicker">LIVE PREVIEW</text>
    <text x="334" y="31" class="sans soft" font-size="9">Same feed, compact layout, palette, and gate/weather rules used by generated main.py.</text>
    <rect x="334" y="46" width="600" height="206" fill="#082035"/>
    <g transform="translate(382 116)">
      <rect width="514" height="128" rx="5" fill="#09233a" stroke="#2b75b7"/>
      <path d="M0 32 H514 M0 64 H514 M0 96 H514 M84 0 V128 M166 0 V128 M286 0 V128 M430 0 V128" stroke="#1b4567" opacity="0.65"/>
      <text x="8" y="19" class="mono" fill="#477da7" font-size="17" font-weight="900">LOS ANGELES DEP</text>
      <text x="190" y="19" class="mono" fill="#477da7" font-size="17" font-weight="900">256x64</text>
      <text x="298" y="19" class="mono" fill="#477da7" font-size="17" font-weight="900">SPLIT-FLAP</text>
      <text x="410" y="19" class="mono" fill="#477da7" font-size="17" font-weight="900">UTC16:02</text>
      <text x="8" y="52" class="mono cyan" font-size="17" font-weight="900">08:27 DL 4108</text><text x="168" y="52" class="mono cyan" font-size="17" font-weight="900">ALBUQUERQUE</text><text x="356" y="52" class="mono" fill="#2a6a70" font-size="17" font-weight="900">DEPARTED 3</text>
      <text x="8" y="80" class="mono cyan" font-size="17" font-weight="900">08:28 UA 2727</text><text x="168" y="80" class="mono cyan" font-size="17" font-weight="900">FORT LAUDERD</text><text x="356" y="80" class="mono cyan" font-size="17" font-weight="900">SCHEDULED 7</text>
      <text x="8" y="108" class="mono cyan" font-size="17" font-weight="900">08:29 UA 1416</text><text x="168" y="108" class="mono cyan" font-size="17" font-weight="900">HOUSTON IAH</text><text x="356" y="108" class="mono amber" font-size="17" font-weight="900">DELAYED +17</text>
    </g>
  </g>

  <text x="8" y="536" class="mono soft" font-size="8">v0.2.7 - Local-first - private by design</text>
</svg>
