<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight mobile settings preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight mobile Settings hub showing LAN Companion and Standalone setup modes, diagnostics choice, quick actions, and local support links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111a"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e8f0f8; }
      .muted { fill: #7f90a5; }
      .blue { fill: #62b7f6; }
      .tiny { font-size: 9px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <g transform="translate(322 18) scale(1.1)" filter="url(#shadow)">
    <rect x="0" y="0" width="288" height="456" rx="42" fill="#03070c"/>
    <rect x="10" y="10" width="268" height="436" rx="34" fill="url(#phone)" stroke="#223242"/>
    <rect x="102" y="18" width="84" height="12" rx="6" fill="#111923"/>

    <g transform="translate(26 40)">
      <text x="0" y="0" class="mono blue" font-size="10" font-weight="900" letter-spacing="2">LOCAL FLIGHT</text>
      <text x="0" y="29" class="sans text" font-size="25" font-weight="900">SETTINGS</text>
      <text x="126" y="29" class="mono muted" font-size="10">MODES</text>

      <g transform="translate(0 48)">
        <rect width="236" height="82" rx="18" fill="#0e151d" stroke="#243344"/>
        <text x="16" y="22" class="mono blue tiny" font-weight="900">LAN COMPANION</text>
        <text x="16" y="43" class="sans text" font-size="12" font-weight="800">Pair with desktop or Pi server</text>
        <circle cx="184" cy="58" r="5" fill="#22c55e"/>
        <text x="196" y="62" class="mono" fill="#22c55e" font-size="9" font-weight="900">ON</text>
        <text x="16" y="64" class="mono muted" font-size="9">WebSocket refresh - server controls</text>
      </g>

      <g transform="translate(0 136)">
        <rect width="236" height="48" rx="18" fill="#0e151d" stroke="#243344"/>
        <text x="16" y="20" class="mono blue tiny" font-weight="900">STANDALONE</text>
        <text x="16" y="39" class="sans text" font-size="11" font-weight="800">Relay-backed phone board - slower refresh</text>
      </g>

      <g transform="translate(0 196)">
        <text x="0" y="0" class="mono muted tiny" font-weight="900">QUICK ACTIONS</text>
        <rect x="0" y="14" width="72" height="54" rx="14" fill="#101923" stroke="#25425c"/>
        <text x="12" y="36" class="mono blue tiny" font-weight="900">LOOK</text>
        <text x="12" y="53" class="sans text" font-size="10" font-weight="800">WX mode</text>
        <rect x="82" y="14" width="72" height="54" rx="14" fill="#101923" stroke="#25425c"/>
        <text x="94" y="36" class="mono blue tiny" font-weight="900">MATRIX</text>
        <text x="94" y="53" class="sans text" font-size="10" font-weight="800">Board</text>
        <rect x="164" y="14" width="72" height="54" rx="14" fill="#101923" stroke="#25425c"/>
        <text x="176" y="36" class="mono blue tiny" font-weight="900">ADMIN</text>
        <text x="176" y="53" class="sans text" font-size="10" font-weight="800">Reports</text>
      </g>

      <g transform="translate(0 282)">
        <rect width="236" height="66" rx="18" fill="#0e151d" stroke="#243344"/>
        <text x="16" y="22" class="mono blue tiny" font-weight="900">HELP &amp; SUPPORT</text>
        <text x="16" y="43" class="sans text" font-size="12" font-weight="800">Changelog - GitHub - Coffee</text>
        <text x="16" y="58" class="mono muted" font-size="9">Diagnostics: manual / auto / logs choice</text>
      </g>

      <g transform="translate(0 362)">
        <rect width="236" height="34" rx="17" fill="#0b1017" stroke="#243344"/>
        <text x="18" y="21" class="mono muted tiny">BOARD</text>
        <text x="80" y="21" class="mono muted tiny">RADAR</text>
        <text x="145" y="21" class="mono muted tiny">HIST</text>
        <text x="202" y="21" class="mono blue tiny" font-weight="900">SET</text>
      </g>
    </g>
  </g>
</svg>
