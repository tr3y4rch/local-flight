<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight radar preview</title>
  <desc id="desc">Illustrative preview of the Local Flight radar screen with METAR bar and aircraft blips.</desc>
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#0a1620"/>
      <stop offset="0.55" stop-color="#071016"/>
      <stop offset="1" stop-color="#020506"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9eda" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#4a9eda" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .muted { fill: #6f8195; }
      .text { fill: #e7edf3; }
      .tiny { font-size: 11px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="924" height="504" rx="22" fill="#0d1218" stroke="#233041"/>

  <rect x="18" y="18" width="924" height="44" rx="22" fill="#0b1017"/>
  <rect x="18" y="40" width="924" height="22" fill="#0b1017"/>
  <text x="42" y="47" class="sans text" font-size="16" font-weight="800">Local Flight</text>
  <text x="137" y="47" class="mono muted tiny">v0.2.3b1</text>
  <text x="574" y="46" class="mono muted tiny">FIDS</text>
  <rect x="634" y="29" width="72" height="24" rx="12" fill="#1f2d3d"/>
  <text x="652" y="46" class="mono text tiny" font-weight="800">RADAR</text>
  <text x="724" y="46" class="mono muted tiny">HISTORY</text>
  <text x="812" y="46" class="mono muted tiny">SETTINGS</text>

  <g transform="translate(42 88)">
    <text x="0" y="0" class="sans text" font-size="23" font-weight="800">Radar - Zurich Airport</text>
    <text x="246" y="0" class="mono muted" font-size="13">ZRH / LSZH</text>
    <text x="742" y="0" class="mono muted" font-size="13">LT 19:24:08</text>

    <rect x="0" y="20" width="876" height="36" rx="10" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="14" y="28" width="45" height="20" rx="5" fill="#22c55e"/>
    <text x="25" y="43" class="mono" fill="#071009" font-size="12" font-weight="900">VFR</text>
    <text x="72" y="42" class="mono" fill="#9fb1c5" font-size="13">Wind 240 at 8 kt - visibility 10 km - few clouds - raw METAR available</text>

    <g transform="translate(438 282)">
      <circle r="174" fill="url(#radarBg)" stroke="rgba(74,158,218,0.25)" stroke-width="2"/>
      <circle r="140" fill="none" stroke="rgba(74,158,218,0.18)"/>
      <circle r="105" fill="none" stroke="rgba(74,158,218,0.18)"/>
      <circle r="70" fill="none" stroke="rgba(74,158,218,0.18)"/>
      <circle r="35" fill="none" stroke="rgba(74,158,218,0.18)"/>
      <line x1="-174" y1="0" x2="174" y2="0" stroke="rgba(74,158,218,0.15)" stroke-dasharray="6 8"/>
      <line x1="0" y1="-174" x2="0" y2="174" stroke="rgba(74,158,218,0.15)" stroke-dasharray="6 8"/>
      <path d="M0 0 L0 -174 A174 174 0 0 1 151 -87 Z" fill="url(#sweep)" opacity="0.75"/>
      <line x1="0" y1="0" x2="0" y2="-174" stroke="#4a9eda" stroke-width="2" opacity="0.9"/>
      <text x="-5" y="-154" class="mono" fill="#4a9eda" font-size="14" text-anchor="middle">N</text>
      <text x="-5" y="165" class="mono" fill="#4a9eda" font-size="14" text-anchor="middle">S</text>
      <text x="153" y="5" class="mono" fill="#4a9eda" font-size="14">E</text>
      <text x="-163" y="5" class="mono" fill="#4a9eda" font-size="14">W</text>
      <circle r="4" fill="#9fcfff"/>
      <circle r="9" fill="none" stroke="#9fcfff" opacity="0.42"/>

      <g class="mono" fill="#bfe3ff" font-size="12" filter="url(#glow)">
        <circle cx="-82" cy="-64" r="4" fill="#dff4ff"/>
        <line x1="-82" y1="-64" x2="-101" y2="-78" stroke="#dff4ff" opacity="0.55"/>
        <text x="-74" y="-68">SWR1842</text>
        <circle cx="62" cy="-94" r="4" fill="#dff4ff"/>
        <line x1="62" y1="-94" x2="81" y2="-105" stroke="#dff4ff" opacity="0.55"/>
        <text x="70" y="-98">BAW713</text>
        <circle cx="104" cy="42" r="4" fill="#dff4ff"/>
        <line x1="104" y1="42" x2="125" y2="52" stroke="#dff4ff" opacity="0.55"/>
        <text x="112" y="38">DLH2369</text>
        <circle cx="-122" cy="76" r="3" fill="#8ccfff" opacity="0.72"/>
        <text x="-114" y="72" opacity="0.8">AFR1115</text>
        <circle cx="18" cy="112" r="3" fill="#8ccfff" opacity="0.68"/>
        <text x="26" y="108" opacity="0.76">EZY82KP</text>
        <circle cx="-28" cy="-132" r="3" fill="#8ccfff" opacity="0.68"/>
        <text x="-20" y="-136" opacity="0.76">RYR46Q</text>
      </g>
    </g>

    <rect x="258" y="466" width="360" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="281" cy="479" r="4" fill="#22c55e"/>
    <text x="296" y="484" class="mono muted" font-size="12">9 aircraft - ADS-B + OpenSky - updated 17:24 UTC</text>
  </g>

  <text x="42" y="499" class="mono muted tiny">README preview - illustrative sample data, not live telemetry</text>
</svg>
