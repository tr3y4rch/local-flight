<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight native radar preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight native radar with runway, surface, map, terrain, and traffic layers.</desc>
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#0f2432"/>
      <stop offset="0.58" stop-color="#08131d"/>
      <stop offset="1" stop-color="#020507"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121b"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9eda" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#4a9eda" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .text { fill: #e8f0f8; }
      .muted { fill: #7890aa; }
      .blue { fill: #62b7f6; }
      .tiny { font-size: 11px; letter-spacing: 1.1px; }
      .chip { font-size: 11px; font-weight: 900; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="924" height="504" rx="22" fill="#0d1218" stroke="#27364a"/>

  <rect x="18" y="18" width="924" height="46" rx="22" fill="#070c12"/>
  <rect x="18" y="42" width="924" height="22" fill="#070c12"/>
  <text x="42" y="47" class="sans text" font-size="16" font-weight="900">Local Flight</text>
  <text x="138" y="47" class="mono muted tiny">v0.2.6</text>
  <text x="548" y="46" class="mono muted tiny">FIDS</text>
  <rect x="620" y="29" width="76" height="24" rx="12" fill="#1e3449" stroke="#31516e"/>
  <text x="639" y="46" class="mono text tiny" font-weight="900">RADAR</text>
  <text x="716" y="46" class="mono muted tiny">MATRIX</text>
  <text x="794" y="46" class="mono muted tiny">SETTINGS</text>
  <text x="876" y="46" class="mono muted tiny">ADMIN</text>

  <g transform="translate(42 86)">
    <text x="0" y="0" class="sans text" font-size="25" font-weight="900">Radar - Noi Bai International</text>
    <text x="354" y="0" class="mono muted" font-size="13">HAN / VVNB - 5 NM surface scope</text>
    <text x="750" y="0" class="mono muted" font-size="13">LT 22:24</text>

    <g transform="translate(0 22)">
      <rect x="0" y="0" width="876" height="42" rx="14" fill="#101822" stroke="#1e2e40"/>
      <rect x="14" y="9" width="48" height="24" rx="12" fill="#07351f" stroke="#146f3a"/>
      <text x="26" y="26" class="mono" fill="#22c55e" font-size="12" font-weight="900">VFR</text>
      <text x="76" y="27" class="mono muted" font-size="13">Friendly WX: 25 C - clear enough for operations - raw METAR available</text>
      <rect x="664" y="8" width="82" height="26" rx="13" fill="#13283a" stroke="#2c5373"/>
      <text x="684" y="26" class="mono blue chip">REAL</text>
      <rect x="758" y="8" width="96" height="26" rx="13" fill="#2a1d09" stroke="#75511a"/>
      <text x="775" y="26" class="mono" fill="#f59e0b" font-size="11" font-weight="900">SURFACE</text>
    </g>

    <g transform="translate(438 286)">
      <circle r="176" fill="url(#radarBg)" stroke="#244c6b" stroke-width="2"/>
      <path d="M-105 95 C-42 42 28 20 104 -18" fill="none" stroke="#4c5f45" stroke-width="9" opacity="0.28"/>
      <path d="M-145 -68 C-74 -44 42 -52 145 -98" fill="none" stroke="#4c5f45" stroke-width="7" opacity="0.22"/>
      <path d="M-120 36 L112 -54" stroke="#d8d1b4" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
      <path d="M-120 36 L112 -54" stroke="#0c1118" stroke-width="2" stroke-dasharray="10 8" opacity="0.76"/>
      <path d="M-22 116 L56 -132" stroke="#d8d1b4" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
      <path d="M-74 18 L-20 -4 L22 16 L86 -8" fill="none" stroke="#70c38b" stroke-width="3" opacity="0.46"/>
      <path d="M-96 58 L-36 36 L8 54 L72 26" fill="none" stroke="#70c38b" stroke-width="2" opacity="0.35"/>
      <circle r="140" fill="none" stroke="#326185" stroke-opacity="0.32"/>
      <circle r="105" fill="none" stroke="#326185" stroke-opacity="0.3"/>
      <circle r="70" fill="none" stroke="#326185" stroke-opacity="0.28"/>
      <circle r="35" fill="none" stroke="#326185" stroke-opacity="0.26"/>
      <line x1="-176" y1="0" x2="176" y2="0" stroke="#326185" stroke-opacity="0.28" stroke-dasharray="6 8"/>
      <line x1="0" y1="-176" x2="0" y2="176" stroke="#326185" stroke-opacity="0.28" stroke-dasharray="6 8"/>
      <path d="M0 0 L0 -176 A176 176 0 0 1 152 -88 Z" fill="url(#sweep)" opacity="0.8"/>
      <line x1="0" y1="0" x2="0" y2="-176" stroke="#62b7f6" stroke-width="2"/>
      <text x="-4" y="-154" class="mono blue" font-size="14" text-anchor="middle">N</text>
      <text x="152" y="5" class="mono blue" font-size="14">E</text>
      <circle r="4" fill="#dff4ff"/>
      <circle r="10" fill="none" stroke="#dff4ff" opacity="0.42"/>

      <g class="mono" fill="#dff4ff" font-size="12" filter="url(#glow)">
        <circle cx="-80" cy="-64" r="4" fill="#ffffff"/>
        <line x1="-80" y1="-64" x2="-100" y2="-78" stroke="#dff4ff" opacity="0.55"/>
        <text x="-72" y="-68">HVN356</text>
        <circle cx="66" cy="-92" r="4" fill="#ffffff"/>
        <line x1="66" y1="-92" x2="88" y2="-103" stroke="#dff4ff" opacity="0.55"/>
        <text x="74" y="-96">QTR8959</text>
        <circle cx="102" cy="44" r="4" fill="#ffffff"/>
        <line x1="102" y1="44" x2="125" y2="54" stroke="#dff4ff" opacity="0.55"/>
        <text x="110" y="40">VJC920</text>
        <circle cx="-40" cy="24" r="3" fill="#22c55e"/>
        <text x="-32" y="20" fill="#88f0b0">GROUND</text>
      </g>
    </g>

    <g transform="translate(0 416)">
      <rect x="0" y="0" width="876" height="42" rx="14" fill="#101822" stroke="#1e2e40"/>
      <text x="18" y="26" class="mono muted" font-size="12">Layers:</text>
      <rect x="82" y="10" width="72" height="22" rx="11" fill="#13283a" stroke="#2c5373"/>
      <text x="102" y="25" class="mono blue chip">RINGS</text>
      <rect x="166" y="10" width="78" height="22" rx="11" fill="#1c2c20" stroke="#3d704c"/>
      <text x="184" y="25" class="mono" fill="#70c38b" font-size="11" font-weight="900">SURFACE</text>
      <rect x="256" y="10" width="78" height="22" rx="11" fill="#2f2b19" stroke="#756d3a"/>
      <text x="279" y="25" class="mono" fill="#d8d1b4" font-size="11" font-weight="900">RUNWAY</text>
      <rect x="346" y="10" width="62" height="22" rx="11" fill="#10202c" stroke="#284866"/>
      <text x="366" y="25" class="mono muted" font-size="11" font-weight="900">MAP</text>
      <text x="622" y="26" class="mono muted" font-size="12">12 aircraft - ground filtered - updated 15:24Z</text>
    </g>
  </g>

  <text x="42" y="501" class="mono muted tiny">Illustrative sample data - runway/surface geometry is server-mediated and cached</text>
</svg>
