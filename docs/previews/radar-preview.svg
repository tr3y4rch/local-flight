<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Flight native radar preview</title>
  <desc id="desc">Illustrative preview of the current Local Flight native Qt radar with LAX range controls, METAR strip, layer toggles, runway labels, and airport surface context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a10"/>
      <stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <radialGradient id="scope" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#0d1b27"/>
      <stop offset="0.66" stop-color="#08121d"/>
      <stop offset="1" stop-color="#050a10"/>
    </radialGradient>
    <style>
      .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .text { fill: #edf5ff; }
      .soft { fill: #89d4ff; }
      .muted { fill: #6f88a2; }
      .dim { fill: #445a72; }
      .tiny { font-size: 8px; letter-spacing: 1.1px; }
      .label { font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    </style>
  </defs>

