description = "Local-first Flight Information Display System (FIDS) with native GUI, LAN browser UI, mobile companion, and LED matrix support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Philipp" }
]

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "requests",
  "tzdata",
  "pydantic>=2.0",
  "packaging",
  "psutil",
  "pystray",
  "pillow",
  "qrcode",
  "python-multipart",
  "cryptography",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "playwright",
  "pytest",
  "pyinstaller>=6.0",
  "PySide6>=6.7",
]
native = [
  "PySide6>=6.7",
]

[project.urls]
Homepage   = "https://beacontools.cc/local-flight"
Repository = "https://github.com/tr3y4rch/local-flight"
Issues    = "https://github.com/tr3y4rch/local-flight/issues"

[project.scripts]
localflight-ui        = "localflight.ui.server:app"
localflight-scheduler = "localflight.scheduler.run_scheduler:main"
localflight-native    = "localflight.native.app:main"
localflight-network-admin = "localflight.native.network_admin:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localflight = [
  "ui/templates/*.html",
  "ui/static/*",
  "ui/static/fonts/*",
  "decode/mappings/*.json",
  "decode/mappings/*.gz",
  "storage/samples/*.json",
]
